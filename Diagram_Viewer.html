<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XSLT Protection Diagrams</title>
<style>
  :root { --bg:#F4F6FA; --panel:#FFFFFF; --ink:#1F2937; --muted:#6B7280; --line:#D9DEE7;
          --accent:#1F3864; --sel:#2E75B6; --stage:#E9EDF3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161D; --panel:#1A2029; --ink:#E5E7EB; --muted:#9CA3AF; --line:#2C3440;
            --accent:#9DB8E8; --sel:#5B9BE0; --stage:#0E1218; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font:14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .app { display:grid; grid-template-columns:260px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:16px 12px; }
  aside h1 { font-size:15px; margin:0 4px 4px; color:var(--accent); }
  aside p { margin:0 4px 14px; color:var(--muted); font-size:12px; }
  .thumb { display:block; width:100%; text-align:left; border:2px solid transparent; border-radius:10px;
           background:none; color:inherit; padding:8px; margin-bottom:8px; cursor:pointer; font:inherit; }
  .thumb:hover { background:var(--bg); }
  .thumb.on { border-color:var(--sel); background:var(--bg); }
  .thumb img { width:100%; border-radius:6px; background:#fff; border:1px solid var(--line); display:block; }
  .thumb span { display:block; font-size:12px; margin-top:6px; }
  .thumb b { color:var(--sel); margin-right:4px; }
  main { display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--panel);
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h2 { font-size:15px; margin:0 auto 0 0; min-width:0; }
  header .count { color:var(--muted); font-size:12px; }
  button.ctl, a.ctl { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px;
           padding:6px 10px; font:inherit; font-size:13px; cursor:pointer; text-decoration:none; }
  button.ctl:hover, a.ctl:hover { border-color:var(--sel); }
  .stage { flex:1; overflow:auto; background:var(--stage); padding:20px; }
  .stage img { display:block; margin:0 auto; background:#fff; border-radius:8px;
               box-shadow:0 2px 12px rgba(0,0,0,.12); max-width:100%; height:auto; }
  .stage.actual img { max-width:none; }
  .hint { color:var(--muted); font-size:12px; padding:6px 16px; background:var(--panel); border-top:1px solid var(--line); }
  @media (max-width: 760px) {
    .app { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    aside { display:flex; gap:8px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:10px; }
    aside h1, aside p { display:none; }
    .thumb { width:140px; flex:0 0 auto; margin:0; }
    .stage { padding:12px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="list">
    <h1>XSLT field protection</h1>
    <p>Diagrams for showing XML fields as FULL, PARTIAL or NONE per user.</p>
  </aside>
  <main>
    <header>
      <h2 id="title"></h2>
      <span class="count" id="count"></span>
      <button class="ctl" id="prev" title="Previous (left arrow)">&#8592; Prev</button>
      <button class="ctl" id="next" title="Next (right arrow)">Next &#8594;</button>
      <button class="ctl" id="zoom" title="Toggle fit / actual size (Z)">Actual size</button>
      <a class="ctl" id="dl" download>Download SVG</a>
    </header>
    <div class="stage" id="stage"><img id="view" alt=""></div>
    <div class="hint">Keys: &#8592; &#8594; to move between diagrams, Z to toggle zoom.</div>
  </main>
</div>

let cur = 0;
try { cur = Math.min(items.length - 1, Math.max(0, parseInt(localStorage.getItem("diagramIndex") || "0", 10))); } catch (e) {}
const list = document.getElementById("list");
items.forEach((it, i) => {
  const b = document.createElement("button");
  b.className = "thumb";
  b.innerHTML = '<img alt=""><span><b>' + (i + 1) + '</b></span>';
  b.querySelector("img").src = it.src;
  b.querySelector("span").append(it.title);
  b.onclick = () => show(i);
  list.appendChild(b);
});
function show(i) {
  cur = (i + items.length) % items.length;
  const it = items[cur];
  document.getElementById("view").src = it.src;
  document.getElementById("view").alt = it.title;
  document.getElementById("title").textContent = it.title;
  document.getElementById("count").textContent = (cur + 1) + " / " + items.length;
  const dl = document.getElementById("dl");
  dl.href = it.src; dl.download = it.file;
  document.querySelectorAll(".thumb").forEach((t, k) => t.classList.toggle("on", k === cur));
  document.querySelectorAll(".thumb")[cur].scrollIntoView({block: "nearest", inline: "nearest"});
  document.getElementById("stage").scrollTo(0, 0);
  try { localStorage.setItem("diagramIndex", String(cur)); } catch (e) {}
}
function toggleZoom() {
  const s = document.getElementById("stage");
  s.classList.toggle("actual");
  document.getElementById("zoom").textContent = s.classList.contains("actual") ? "Fit to window" : "Actual size";
}
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("zoom").onclick = toggleZoom;
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "z" || e.key === "Z") toggleZoom();
});
show(cur);
</script>

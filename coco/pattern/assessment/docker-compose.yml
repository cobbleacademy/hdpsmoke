version: "3.8"

# ── Local "production-like" stack ─────────────────────────────────────────────
# Mirrors the Kubernetes deployment: nginx fronts React and proxies /api/* to
# the Express backend. No dev-server hot-reload — use `npm run dev` for that.
#
# Usage:
#   docker-compose up --build -d                        # bring up (detached)
#   docker-compose down                                 # bring down
#   docker-compose down --rmi local                     # bring down + remove images
#   PROVIDER_URLS="https://..." docker-compose up -d    # override env, no rebuild
#   open http://localhost:3000/api/pattern/assessment/
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (Express + scoring engine + OpenAI) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pattern-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "3001"
      NODE_ENV: production
      FRONTEND_URL: "http://localhost:3000"
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Custom CA bundle for provider endpoints signed by an internal CA
      # (fixes "unable to get local issuer certificate"). See backend/certs/README.md.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # ── Provider API (Payload Library) — tab mode ────────────────────
      # Set PROVIDER_ENVS to enable the tab-per-environment UI.
      # Each environment gets its own tab, payload file, and URL list.
      # Override any of these in your shell before running docker-compose up.
      PROVIDER_ENVS: ${PROVIDER_ENVS:-ADM-DEV,DEV,NPE,PROD}
      PROVIDER_ENV_PAYLOAD_FILES: ${PROVIDER_ENV_PAYLOAD_FILES:-adm_dev,dev,npe,prod}
      # Per-environment URL triplets (ID must match an entry in PROVIDER_ENVS)
      # Note: hyphens in IDs become underscores in the env var key (ADM-DEV → ADM_DEV)
      PROVIDER_ADM_DEV_URLS: ${PROVIDER_ADM_DEV_URLS:-https://adm-dev-z3-providerservices.com/api/dev1/runtime/resolution/v3}
      PROVIDER_ADM_DEV_URL_LABELS: ${PROVIDER_ADM_DEV_URL_LABELS:-ADM-DEV Direct}
      PROVIDER_ADM_DEV_URL_AUTH_TYPES: ${PROVIDER_ADM_DEV_URL_AUTH_TYPES:-api-key}
      PROVIDER_ADM_DEV_URL_TLS_VERIFY: ${PROVIDER_ADM_DEV_URL_TLS_VERIFY:-true}
      PROVIDER_ADM_DEV_API_KEY: ${PROVIDER_ADM_DEV_API_KEY:-}
      PROVIDER_ADM_DEV_ENTRA_TENANT_ID: ${PROVIDER_ADM_DEV_ENTRA_TENANT_ID:-}
      PROVIDER_ADM_DEV_ENTRA_CLIENT_ID: ${PROVIDER_ADM_DEV_ENTRA_CLIENT_ID:-}
      PROVIDER_ADM_DEV_ENTRA_CLIENT_SECRET: ${PROVIDER_ADM_DEV_ENTRA_CLIENT_SECRET:-}
      PROVIDER_ADM_DEV_ENTRA_SCOPE: ${PROVIDER_ADM_DEV_ENTRA_SCOPE:-}
      PROVIDER_ADM_DEV_X_APIKEY: ${PROVIDER_ADM_DEV_X_APIKEY:-}
      PROVIDER_ADM_DEV_X_APISECRET: ${PROVIDER_ADM_DEV_X_APISECRET:-}
      PROVIDER_DEV_URLS: ${PROVIDER_DEV_URLS:-https://dev-z3-providerservices.com/api/dev1/runtime/resolution/v3}
      PROVIDER_DEV_URL_LABELS: ${PROVIDER_DEV_URL_LABELS:-Dev Direct}
      PROVIDER_DEV_URL_AUTH_TYPES: ${PROVIDER_DEV_URL_AUTH_TYPES:-api-key}
      PROVIDER_DEV_URL_TLS_VERIFY: ${PROVIDER_DEV_URL_TLS_VERIFY:-true}
      PROVIDER_DEV_API_KEY: ${PROVIDER_DEV_API_KEY:-}
      PROVIDER_DEV_ENTRA_TENANT_ID: ${PROVIDER_DEV_ENTRA_TENANT_ID:-}
      PROVIDER_DEV_ENTRA_CLIENT_ID: ${PROVIDER_DEV_ENTRA_CLIENT_ID:-}
      PROVIDER_DEV_ENTRA_CLIENT_SECRET: ${PROVIDER_DEV_ENTRA_CLIENT_SECRET:-}
      PROVIDER_DEV_ENTRA_SCOPE: ${PROVIDER_DEV_ENTRA_SCOPE:-}
      PROVIDER_DEV_X_APIKEY: ${PROVIDER_DEV_X_APIKEY:-}
      PROVIDER_DEV_X_APISECRET: ${PROVIDER_DEV_X_APISECRET:-}
      PROVIDER_NPE_URLS: ${PROVIDER_NPE_URLS:-https://npe-z3-providerservices.com/api/dev1/runtime/resolution/v3}
      PROVIDER_NPE_URL_LABELS: ${PROVIDER_NPE_URL_LABELS:-NPE Direct}
      PROVIDER_NPE_URL_AUTH_TYPES: ${PROVIDER_NPE_URL_AUTH_TYPES:-api-key}
      PROVIDER_NPE_URL_TLS_VERIFY: ${PROVIDER_NPE_URL_TLS_VERIFY:-true}
      PROVIDER_NPE_API_KEY: ${PROVIDER_NPE_API_KEY:-}
      PROVIDER_NPE_ENTRA_TENANT_ID: ${PROVIDER_NPE_ENTRA_TENANT_ID:-}
      PROVIDER_NPE_ENTRA_CLIENT_ID: ${PROVIDER_NPE_ENTRA_CLIENT_ID:-}
      PROVIDER_NPE_ENTRA_CLIENT_SECRET: ${PROVIDER_NPE_ENTRA_CLIENT_SECRET:-}
      PROVIDER_NPE_ENTRA_SCOPE: ${PROVIDER_NPE_ENTRA_SCOPE:-}
      PROVIDER_NPE_X_APIKEY: ${PROVIDER_NPE_X_APIKEY:-}
      PROVIDER_NPE_X_APISECRET: ${PROVIDER_NPE_X_APISECRET:-}
      PROVIDER_PROD_URLS: ${PROVIDER_PROD_URLS:-https://apigee.com/api/dev1/runtime/resolution/v3}
      PROVIDER_PROD_URL_LABELS: ${PROVIDER_PROD_URL_LABELS:-Prod via APIGEE}
      PROVIDER_PROD_URL_AUTH_TYPES: ${PROVIDER_PROD_URL_AUTH_TYPES:-entraid-apigee}
      PROVIDER_PROD_URL_TLS_VERIFY: ${PROVIDER_PROD_URL_TLS_VERIFY:-true}
      PROVIDER_PROD_API_KEY: ${PROVIDER_PROD_API_KEY:-}
      PROVIDER_PROD_ENTRA_TENANT_ID: ${PROVIDER_PROD_ENTRA_TENANT_ID:-}
      PROVIDER_PROD_ENTRA_CLIENT_ID: ${PROVIDER_PROD_ENTRA_CLIENT_ID:-}
      PROVIDER_PROD_ENTRA_CLIENT_SECRET: ${PROVIDER_PROD_ENTRA_CLIENT_SECRET:-}
      PROVIDER_PROD_ENTRA_SCOPE: ${PROVIDER_PROD_ENTRA_SCOPE:-}
      PROVIDER_PROD_X_APIKEY: ${PROVIDER_PROD_X_APIKEY:-}
      PROVIDER_PROD_X_APISECRET: ${PROVIDER_PROD_X_APISECRET:-}
      # ── Legacy mode fallback (used when PROVIDER_ENVS is not set) ─────
      PROVIDER_URLS: ${PROVIDER_URLS:-https://dev-z3-providerservices.com/api/dev1/runtime/resolution/v3,https://apigee.com/api/dev1/runtime/resolution/v3}
      PROVIDER_URL_LABELS: ${PROVIDER_URL_LABELS:-Dev Z3,APIGEE Prod}
      PROVIDER_AUTH_TYPE: ${PROVIDER_AUTH_TYPE:-none}
      # ── Global TLS fallback ───────────────────────────────────────────
      PROVIDER_SKIP_TLS_VERIFY: ${PROVIDER_SKIP_TLS_VERIFY:-false}
      # ── Global credential fallbacks ───────────────────────────────────
      # Used when the matching PROVIDER_{ENV}_* var above is not set.
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      PROVIDER_ENTRA_TENANT_ID: ${PROVIDER_ENTRA_TENANT_ID:-}
      PROVIDER_ENTRA_CLIENT_ID: ${PROVIDER_ENTRA_CLIENT_ID:-}
      PROVIDER_ENTRA_CLIENT_SECRET: ${PROVIDER_ENTRA_CLIENT_SECRET:-}
      PROVIDER_ENTRA_SCOPE: ${PROVIDER_ENTRA_SCOPE:-}
      PROVIDER_X_APIKEY: ${PROVIDER_X_APIKEY:-}
      PROVIDER_X_APISECRET: ${PROVIDER_X_APISECRET:-}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-15000}
      # ── Payload encryption ────────────────────────────────────────────────
      PAYLOAD_ENCRYPTION_KEY: ${PAYLOAD_ENCRYPTION_KEY:-}
      PAYLOAD_STORAGE_PATH: /app/data/payloads
      PAYLOAD_WRITE_AUTH_ENABLED: ${PAYLOAD_WRITE_AUTH_ENABLED:-false}
      PAYLOAD_ADMIN_TOKEN: ${PAYLOAD_ADMIN_TOKEN:-}
      # Plain-text fallback paths — point to the bind-mounted frontend public files.
      # Used by readPayload steps 2 & 3 when no .enc file exists yet.
      PAYLOAD_FALLBACK_DIR: /app/public/payloads
      PAYLOAD_LEGACY_YAML: /app/public/payloads.yaml
      # ── OPA Policy Generator (ABAC → Rego) ────────────────────────────────────
      GITHUB_DEFAULT_OWNER: ${GITHUB_DEFAULT_OWNER:-ffgdeo}
      GITHUB_DEFAULT_REPO: ${GITHUB_DEFAULT_REPO:-uc-governance-demo}
      GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-main}
      GITHUB_DEFAULT_ABAC_PATH: ${GITHUB_DEFAULT_ABAC_PATH:-notebooks/04_row_filters_abac.py}
      GITHUB_DEFAULT_FETCH_MODE: ${GITHUB_DEFAULT_FETCH_MODE:-api}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPA_LLM_MODEL: ${OPA_LLM_MODEL:-gpt-4o}
      OPA_POLICY_STORAGE_PATH: /app/data/opa-policies
      # ── ABAC multi-environment support ────────────────────────────────────────
      ABAC_ENVS: ${ABAC_ENVS:-DEV,NPE,PROD}
      ABAC_DEV_BRANCH: ${ABAC_DEV_BRANCH:-dev}
      ABAC_DEV_BASE_PATH: ${ABAC_DEV_BASE_PATH:-policies/dev/}
      ABAC_NPE_BRANCH: ${ABAC_NPE_BRANCH:-npe}
      ABAC_NPE_BASE_PATH: ${ABAC_NPE_BASE_PATH:-policies/npe/}
      ABAC_PROD_BRANCH: ${ABAC_PROD_BRANCH:-main}
      ABAC_PROD_BASE_PATH: ${ABAC_PROD_BASE_PATH:-policies/}
      # ── Ranger Library (Rego → Apache Ranger Policy) ──────────────────────────
      RANGER_ENVS: ${RANGER_ENVS:-DEV,NPE,PROD}
      RANGER_LLM_MODEL: ${RANGER_LLM_MODEL:-gpt-4o}
      RANGER_POLICY_STORAGE_PATH: /app/data/ranger-policies
      RANGER_GITHUB_OWNER: ${RANGER_GITHUB_OWNER:-}
      RANGER_GITHUB_REPO: ${RANGER_GITHUB_REPO:-}
      RANGER_GITHUB_BRANCH: ${RANGER_GITHUB_BRANCH:-main}
      RANGER_GITHUB_REGO_PATH: ${RANGER_GITHUB_REGO_PATH:-}
      RANGER_GITHUB_FETCH_MODE: ${RANGER_GITHUB_FETCH_MODE:-api}
      # ── Group Permission Evaluation ───────────────────────────────────────────
      # USE_LLM=true uses the shared OpenAI client (OPENAI_API_KEY/OPENAI_BASE_URL
      # above) for structured-output prompt parsing; false uses the regex parser.
      USE_LLM: ${USE_LLM:-false}
      PERMISSION_LLM_MODEL: ${PERMISSION_LLM_MODEL:-}
      # PERMISSION_ENVS enables the tab-per-environment UI (mirrors RANGER_ENVS).
      # Each environment below points at a deliberately different table/column
      # shape in the local postgres container — see backend/db/init.sql — to
      # prove the per-env schema-mapping config works against real differences,
      # not just different data. Omit PERMISSION_ENVS for a single "Default" env
      # (falls back to the flat DATABASE_URL var, same shape as DEV below).
      PERMISSION_ENVS: ${PERMISSION_ENVS:-DEV,NPE,PROD}
      DATABASE_URL: postgresql://permission_app:${POSTGRES_PASSWORD:-permission_dev_pw}@postgres:5432/permission_db
      # DEV — same shape as the flat DATABASE_URL fallback above (users/groups,
      # location_tier enum). Listed explicitly — including the schema-mapping
      # vars below, even though they match the built-in defaults — so DEV is
      # symmetric with NPE/PROD here and isn't mistaken for missing config.
      PERMISSION_DEV_DATABASE_URL: postgresql://permission_app:${POSTGRES_PASSWORD:-permission_dev_pw}@postgres:5432/permission_db
      # SSL stays disabled for this local container — it has no certificate
      # configured and would reject a TLS handshake attempt. Set
      # PERMISSION_{ENV}_DB_SSL=true when pointing any environment at a real
      # managed Postgres instance instead (see backend/.env.example).
      PERMISSION_DEV_DB_SSL: ${PERMISSION_DEV_DB_SSL:-false}
      PERMISSION_NPE_DB_SSL: ${PERMISSION_NPE_DB_SSL:-false}
      PERMISSION_PROD_DB_SSL: ${PERMISSION_PROD_DB_SSL:-false}
      PERMISSION_DEV_USERS_TABLE: users
      PERMISSION_DEV_USER_KEY_COLUMN: user_principal_name
      PERMISSION_DEV_USER_LOCATION_COLUMN: location
      PERMISSION_DEV_GROUPS_TABLE: groups
      PERMISSION_DEV_GROUP_KEY_COLUMN: group_id
      PERMISSION_DEV_GROUP_LOCATION_COLUMN: restricted_location
      # NPE — different table/column names, same literal tier values.
      PERMISSION_NPE_DATABASE_URL: postgresql://permission_app:${POSTGRES_PASSWORD:-permission_dev_pw}@postgres:5432/permission_npe
      PERMISSION_NPE_USERS_TABLE: identity_users
      PERMISSION_NPE_USER_KEY_COLUMN: upn
      PERMISSION_NPE_USER_LOCATION_COLUMN: region_tier
      PERMISSION_NPE_GROUPS_TABLE: resource_groups
      PERMISSION_NPE_GROUP_KEY_COLUMN: grp_id
      PERMISSION_NPE_GROUP_LOCATION_COLUMN: access_tier
      # PROD — different table/column names AND abbreviated tier codes
      # (ON/NS/OS instead of ONSHORE/NEARSHORE/OFFSHORE) — exercises
      # PERMISSION_PROD_LOCATION_VALUE_MAP.
      PERMISSION_PROD_DATABASE_URL: postgresql://permission_app:${POSTGRES_PASSWORD:-permission_dev_pw}@postgres:5432/permission_prod
      PERMISSION_PROD_USERS_TABLE: app_users
      PERMISSION_PROD_USER_KEY_COLUMN: email
      PERMISSION_PROD_USER_LOCATION_COLUMN: loc_tier
      PERMISSION_PROD_GROUPS_TABLE: app_groups
      PERMISSION_PROD_GROUP_KEY_COLUMN: code
      PERMISSION_PROD_GROUP_LOCATION_COLUMN: min_tier
      PERMISSION_PROD_LOCATION_VALUE_MAP: "ONSHORE:ON,NEARSHORE:NS,OFFSHORE:OS,NONE:NONE"
      # ── Identity Audit ─────────────────────────────────────────────────────────
      # IDENTITY_AUDIT_USE_LLM is independent of USE_LLM above — separate features,
      # separate switches, sharing only the underlying OpenAI client/config.
      IDENTITY_AUDIT_USE_LLM: ${IDENTITY_AUDIT_USE_LLM:-false}
      IDENTITY_AUDIT_LLM_MODEL: ${IDENTITY_AUDIT_LLM_MODEL:-}
      # PERMISSION_ENVS=DEV,NPE,PROD by default — leave Entra credentials blank
      # (the default) to run every environment in mock mode, since there is no
      # real Azure tenant wired into this local stack. Set real
      # IDENTITY_AUDIT_{ENV}_TENANT_ID/_CLIENT_ID/_CLIENT_SECRET to exercise a
      # genuine Microsoft Graph lookup for that environment.
      IDENTITY_AUDIT_ENVS: ${IDENTITY_AUDIT_ENVS:-DEV,NPE,PROD}
      IDENTITY_AUDIT_DEV_TENANT_ID: ${IDENTITY_AUDIT_DEV_TENANT_ID:-}
      IDENTITY_AUDIT_DEV_CLIENT_ID: ${IDENTITY_AUDIT_DEV_CLIENT_ID:-}
      IDENTITY_AUDIT_DEV_CLIENT_SECRET: ${IDENTITY_AUDIT_DEV_CLIENT_SECRET:-}
      IDENTITY_AUDIT_DEV_DEFAULT_FILTERS: ${IDENTITY_AUDIT_DEV_DEFAULT_FILTERS:-}
      IDENTITY_AUDIT_NPE_TENANT_ID: ${IDENTITY_AUDIT_NPE_TENANT_ID:-}
      IDENTITY_AUDIT_NPE_CLIENT_ID: ${IDENTITY_AUDIT_NPE_CLIENT_ID:-}
      IDENTITY_AUDIT_NPE_CLIENT_SECRET: ${IDENTITY_AUDIT_NPE_CLIENT_SECRET:-}
      IDENTITY_AUDIT_NPE_DEFAULT_FILTERS: ${IDENTITY_AUDIT_NPE_DEFAULT_FILTERS:-}
      IDENTITY_AUDIT_PROD_TENANT_ID: ${IDENTITY_AUDIT_PROD_TENANT_ID:-}
      IDENTITY_AUDIT_PROD_CLIENT_ID: ${IDENTITY_AUDIT_PROD_CLIENT_ID:-}
      IDENTITY_AUDIT_PROD_CLIENT_SECRET: ${IDENTITY_AUDIT_PROD_CLIENT_SECRET:-}
      IDENTITY_AUDIT_PROD_DEFAULT_FILTERS: ${IDENTITY_AUDIT_PROD_DEFAULT_FILTERS:-}
    volumes:
      # Persistent storage for encrypted payloads and OPA policies
      - payload-storage:/app/data/payloads
      - opa-storage:/app/data/opa-policies
      # Bind mount — Ranger policy files written to ./backend/data/ranger-policies/ on host
      # so they are visible alongside OPA policies in the local data folder.
      - ./backend/data/ranger-policies:/app/data/ranger-policies
      # Read-only bind mounts so the backend can serve plain YAML as a fallback
      # before encrypted files are created (migration path / first run).
      - ./frontend/public/payloads:/app/public/payloads:ro
      - ./frontend/public/payloads.yaml:/app/public/payloads.yaml:ro
      # Custom CA bundle — drop .pem/.crt files into backend/certs/ and set
      # NODE_EXTRA_CA_CERTS to pick them up without a rebuild.
      - ./backend/certs:/app/certs:ro
    ports:
      - "3001:3001"     # exposed for direct curl testing; not needed by frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pattern-net

  # ── Postgres (Group Permission Evaluation) ───────────────────────────────────
  # Deliberately scoped to this one feature — see docs/adr/0015-group-permission-evaluation.md
  # for why this app otherwise stays database-free (docs/adr/0005-no-database.md).
  postgres:
    image: postgres:16-alpine
    container_name: pattern-postgres
    environment:
      POSTGRES_USER: permission_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-permission_dev_pw}
      POSTGRES_DB: permission_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once automatically against an empty data volume — DDL + seed data.
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permission_app -d permission_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - pattern-net

  # ── Frontend (React SPA + nginx proxy) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pattern-frontend
    ports:
      - "3000:80"       # browse at http://localhost:3000
    # "host.docker.internal" (used by nginx.conf's /api/sensec/hsm/ block to reach
    # the independently-run HSM encryption service on the host, port 3005) resolves
    # automatically on Docker Desktop (Mac/Windows) — no extra_hosts entry needed here.
    # On Linux Docker Engine with Compose 1.28+ / Docker 20.10+, add:
    #   extra_hosts: ["host.docker.internal:host-gateway"]
    # Older Compose/Docker on Linux: replace host.docker.internal in nginx.conf with
    # the host's actual LAN/bridge IP, or run the HSM service in this same network.
    # Not needed in real deployments — Istio routes /api/sensec/hsm directly to the
    # HSM service's own pod, bypassing this frontend entirely.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pattern-net

networks:
  pattern-net:
    driver: bridge

volumes:
  payload-storage:
    # Named volume — persists encrypted payload files across container restarts.
    # To pre-populate, run the migration script:
    #   PAYLOAD_ENCRYPTION_KEY=<key> node backend/scripts/encrypt-payloads.js

  opa-storage:
    # Named volume — persists encrypted OPA policy files across container restarts.
    # Stores per-environment manifests and policy Rego files.
    # To pre-populate with encrypted policies, mount before running migrations.

  # ranger-storage was replaced with a host bind mount (./backend/data/ranger-policies)
  # so policy files are visible on the local filesystem alongside OPA policies.

  postgres-data:
    # Named volume — persists the Group Permission Evaluation database
    # (users, groups tables) across container restarts.

# nginx.conf — used by both Docker Compose and the Helm ConfigMap (see templates/frontend/configmap.yaml).
# In Kubernetes the proxy_pass host is overridden by the Helm template.
# In Docker Compose the backend service is reachable as "backend" via Docker DNS.

server {
  listen 80;

  # Root applies to all locations that don't override it
  root /usr/share/nginx/html;

  # ── Immutable hashed assets (Vite build output) ───────────────────────────────
  # ^~ beats regex locations so no need to check them for /assets/.
  # try_files $uri =404 returns a real 404 for missing files instead of silently
  # serving index.html — makes version-mismatch failures immediately visible.
  # Vite filenames include a content hash so a 1-year cache is safe.
  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ── Static React SPA ─────────────────────────────────────────────────────────
  # index.html must not be cached — the browser must always fetch the latest
  # version so it references the correct hashed asset filenames.
  location / {
    index  index.html;
    try_files $uri $uri/ /index.html;   # SPA client-side routing fallback
    add_header Cache-Control "no-cache";
  }

  # ── API reverse proxy → backend service ──────────────────────────────────────
  # Only the two real API endpoints are proxied; all other paths under
  # /api/pattern/assessment/* are SPA frontend routes served by try_files above.
  # Docker Compose: "backend" resolves to the backend container via Docker DNS.
  # Kubernetes:     replaced by the Helm ConfigMap with the K8s service name.
  location ~ ^/api/pattern/assessment/(questions|submit)$ {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;   # LLM calls can take up to ~30 s
  }

  # ── Lightweight health endpoint for Docker HEALTHCHECK ────────────────────────
  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # ── Security headers ──────────────────────────────────────────────────────────
  add_header X-Frame-Options         SAMEORIGIN;
  add_header X-Content-Type-Options  nosniff;
  add_header Referrer-Policy         strict-origin-when-cross-origin;

  # ── Gzip compression ──────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript image/svg+xml;
  gzip_min_length 1024;
}

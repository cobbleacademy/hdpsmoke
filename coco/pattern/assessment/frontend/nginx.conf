# nginx.conf
#
# Istio context: VirtualService matches prefix /api/pattern/assessment and rewrites
# uri to /api/pattern/assessment (no-op) — nginx receives the full original path.
# All app traffic therefore arrives under /api/pattern/assessment/.
#
# Docker Compose: proxy_pass targets "backend" (Docker DNS).
# Kubernetes:     proxy_pass is overridden by the Helm ConfigMap with the K8s service name.

server {
  listen 80;
  root /usr/share/nginx/html;

  # Security headers — inherited by locations that have NO add_header of their own.
  # Locations that declare add_header must repeat the security headers explicitly
  # because nginx does not merge add_header across levels.
  add_header X-Frame-Options         SAMEORIGIN;
  add_header X-Content-Type-Options  nosniff;
  add_header Referrer-Policy         strict-origin-when-cross-origin;

  # ── Health probe ─────────────────────────────────────────────────────────────
  # Kubernetes liveness/readiness probes hit the pod directly — outside Istio routing.
  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # ── API endpoints — exact match, proxied to backend ──────────────────────────
  # = (exact) has the highest location priority; no regex or prefix check needed.
  # Docker Compose:  backend resolves to the backend container via Docker DNS.
  # Kubernetes:      replaced by the Helm ConfigMap with the K8s service name.
  location = /api/pattern/assessment/questions {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
  }

  location = /api/pattern/assessment/submit {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
  }

  location = /api/pattern/assessment/provider-config {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
  }

  location = /api/pattern/assessment/run-payload {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    # Must exceed PROVIDER_TIMEOUT_MS (default 15s) + backend overhead
    proxy_read_timeout    30s;
  }

  # ── OPA Policy Generator API endpoints ─────────────────────────────────────────
  # Prefix match to catch all OPA routes: config, manifest, parse, generate, stale, policy
  location ^~ /api/pattern/assessment/opa- {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    # OPA generation can take time (LLM calls). Local/Ollama CPU inference for
    # larger prompts can run several minutes — keep this generous. OpenAI-backed
    # generation typically completes in well under 60s.
    proxy_read_timeout    300s;
    client_max_body_size  5m;
  }

  # ── Payload content API (read/write encrypted YAML) ───────────────────────────
  # ^~ prefix beats the static catch-all below for these paths.
  # Handles GET /payload-content/:envId and PUT /payload-content/:envId.
  location ^~ /api/pattern/assessment/payload-content/ {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    client_max_body_size  2m;
  }

  # ── Immutable hashed assets ───────────────────────────────────────────────────
  # ^~ skips regex; alias strips the app prefix so the file lookup hits /assets/.
  # try_files =404 returns a real 404 for missing files — no silent HTML fallback.
  # Vite content-hashed filenames are safe to cache for a year.
  location ^~ /api/pattern/assessment/assets/ {
    alias /usr/share/nginx/html/assets/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control         "public, immutable";
    add_header X-Content-Type-Options nosniff;
    access_log off;
  }

  # ── SPA + static files under app prefix ──────────────────────────────────────
  # Handles: index.html, payloads.yaml, favicon, and any other public/ assets.
  # alias strips the Istio prefix so nginx looks in /usr/share/nginx/html/.
  # Unknown paths (SPA client-side routes) fall to @spa which serves index.html.
  location ^~ /api/pattern/assessment/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ @spa;
    add_header Cache-Control         "no-cache";
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
  }

  # ── SPA client-side routing fallback ─────────────────────────────────────────
  location @spa {
    try_files /index.html =404;
    add_header Cache-Control         "no-cache";
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
  }

  # ── Gzip compression ──────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript image/svg+xml;
  gzip_min_length 1024;
}

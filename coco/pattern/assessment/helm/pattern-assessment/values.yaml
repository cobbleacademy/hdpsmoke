# ── values.yaml — default values (safe for local / CI preview) ────────────────
# Override per environment with values-staging.yaml / values-prod.yaml

global:
  registry: myacr.azurecr.io          # Azure Container Registry hostname
  imagePullPolicy: IfNotPresent

nameOverride: ""

# ── Backend ───────────────────────────────────────────────────────────────────
backend:
  image: pattern-backend
  tag: latest
  replicas: 1
  port: 3001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  env:
    OPENAI_MODEL: gpt-4o-mini
    # OPENAI_BASE_URL: point at any OpenAI-compatible endpoint (e.g. a self-hosted
    # Ollama server). Leave unset/empty to use https://api.openai.com/v1.
    # Setting this (with or without OPENAI_API_KEY) takes the app out of mock mode
    # for both the assessment explanation and OPA Rego generation.
    OPENAI_BASE_URL: ""

    # ── LLM gateway — per-environment overrides ──────────────────────────────
    # Shared across every LLM-consuming feature (OPA Generator, Ranger Library,
    # Identity Audit, Permission Checker) keyed by env label — DEV/NPE/PROD
    # here, matching ABAC_ENVS/RANGER_ENVS/PERMISSION_ENVS/IDENTITY_AUDIT_ENVS,
    # which all default to the same three labels. Each var falls back
    # independently to its global OPENAI_* counterpart above when unset for
    # that environment (same per-var fallback shape as PROVIDER_{ENV}_API_KEY
    # falling back to PROVIDER_API_KEY).
    #
    # LLM_{ENV}_OPENAI_BASE_URL may contain a literal "{model}" placeholder for
    # gateways that require the model in the URL path rather than the request
    # body (e.g. https://<gateway>/chat/{model}) — substituted with the
    # resolved model (RANGER_LLM_MODEL / OPA_LLM_MODEL / etc.) before the
    # client is constructed. Omit the placeholder for gateways that take the
    # model in the request body instead (Ollama, plain OpenAI).
    #
    # LLM_{ENV}_OPENAI_EXTRA_HEADERS: JSON object of static headers the
    # gateway requires on every request (e.g. tenant/auth headers), applied
    # via the OpenAI SDK's defaultHeaders — no per-call-site header code needed.
    #
    # LLM_{ENV}_OPENAI_OMIT_TEMPERATURE / LLM_{ENV}_OPENAI_MAX_TOKENS_PARAM /
    # LLM_{ENV}_OPENAI_REASONING_EFFORT:
    # OPA Generator and Ranger Library send temperature + a token-limit param
    # on every call. Reasoning-class models (o1/o3/gpt-5-style) reject
    # temperature outright and require max_completion_tokens instead of
    # max_tokens — set these per env if that env's gateway/model is
    # reasoning-class; leave blank for classic chat-completions models.
    # REASONING_EFFORT ("minimal"|"low"|"medium"|"high") only applies to
    # reasoning-class models — lower effort cuts response time for a mostly
    # mechanical transform, reducing exposure to gateway/edge 504s.
    LLM_DEV_OPENAI_BASE_URL: ""
    LLM_DEV_OPENAI_API_KEY: ""
    LLM_DEV_OPENAI_MODEL: ""
    LLM_DEV_OPENAI_EXTRA_HEADERS: ""
    LLM_DEV_OPENAI_OMIT_TEMPERATURE: ""
    LLM_DEV_OPENAI_MAX_TOKENS_PARAM: ""
    LLM_DEV_OPENAI_REASONING_EFFORT: ""
    LLM_NPE_OPENAI_BASE_URL: ""
    LLM_NPE_OPENAI_API_KEY: ""
    LLM_NPE_OPENAI_MODEL: ""
    LLM_NPE_OPENAI_EXTRA_HEADERS: ""
    LLM_NPE_OPENAI_OMIT_TEMPERATURE: ""
    LLM_NPE_OPENAI_MAX_TOKENS_PARAM: ""
    LLM_NPE_OPENAI_REASONING_EFFORT: ""
    LLM_PROD_OPENAI_BASE_URL: ""
    LLM_PROD_OPENAI_API_KEY: ""
    LLM_PROD_OPENAI_MODEL: ""
    LLM_PROD_OPENAI_EXTRA_HEADERS: ""
    LLM_PROD_OPENAI_OMIT_TEMPERATURE: ""
    LLM_PROD_OPENAI_MAX_TOKENS_PARAM: ""
    LLM_PROD_OPENAI_REASONING_EFFORT: ""

    FRONTEND_URL: "http://localhost"   # overridden per environment

    # NODE_EXTRA_CA_CERTS: path to a PEM bundle of additional trusted CA certs,
    # baked into the backend image at /app/certs/ (see backend/certs/README.md).
    # Fixes "unable to get local issuer certificate" for provider endpoints
    # (e.g. APIGEE) signed by an internal/corporate CA. Leave empty if not needed.
    NODE_EXTRA_CA_CERTS: ""

    # ── Provider API (Payload Library) — tab mode ────────────────────────────
    # Set PROVIDER_ENVS to enable the tab-per-environment Payload Library UI.
    # Leave blank to fall back to legacy single-panel mode (PROVIDER_URLS below).
    PROVIDER_ENVS: ""
    PROVIDER_ENV_PAYLOAD_FILES: ""
    # Per-environment URL triplets — set via --set at deploy time.
    # Pattern: PROVIDER_{ID}_URLS / _URL_LABELS / _URL_AUTH_TYPES
    # Note: hyphens in IDs become underscores (ADM-DEV → ADM_DEV).
    PROVIDER_ADM_DEV_URLS: ""
    PROVIDER_ADM_DEV_URL_LABELS: ""
    PROVIDER_ADM_DEV_URL_AUTH_TYPES: ""
    PROVIDER_ADM_DEV_URL_TLS_VERIFY: "true"
    # Per-env credentials for ADM-DEV — set via --set at deploy time
    PROVIDER_ADM_DEV_API_KEY: ""
    PROVIDER_ADM_DEV_ENTRA_TENANT_ID: ""
    PROVIDER_ADM_DEV_ENTRA_CLIENT_ID: ""
    PROVIDER_ADM_DEV_ENTRA_CLIENT_SECRET: ""
    PROVIDER_ADM_DEV_ENTRA_SCOPE: ""
    PROVIDER_ADM_DEV_X_APIKEY: ""
    PROVIDER_ADM_DEV_X_APISECRET: ""
    PROVIDER_DEV_URLS: ""
    PROVIDER_DEV_URL_LABELS: ""
    PROVIDER_DEV_URL_AUTH_TYPES: ""
    PROVIDER_DEV_URL_TLS_VERIFY: "true"
    # Per-env credentials for DEV — set via --set at deploy time
    PROVIDER_DEV_API_KEY: ""
    PROVIDER_DEV_ENTRA_TENANT_ID: ""
    PROVIDER_DEV_ENTRA_CLIENT_ID: ""
    PROVIDER_DEV_ENTRA_CLIENT_SECRET: ""
    PROVIDER_DEV_ENTRA_SCOPE: ""
    PROVIDER_DEV_X_APIKEY: ""
    PROVIDER_DEV_X_APISECRET: ""
    PROVIDER_NPE_URLS: ""
    PROVIDER_NPE_URL_LABELS: ""
    PROVIDER_NPE_URL_AUTH_TYPES: ""
    PROVIDER_NPE_URL_TLS_VERIFY: "true"
    # Per-env credentials for NPE — set via --set at deploy time
    PROVIDER_NPE_API_KEY: ""
    PROVIDER_NPE_ENTRA_TENANT_ID: ""
    PROVIDER_NPE_ENTRA_CLIENT_ID: ""
    PROVIDER_NPE_ENTRA_CLIENT_SECRET: ""
    PROVIDER_NPE_ENTRA_SCOPE: ""
    PROVIDER_NPE_X_APIKEY: ""
    PROVIDER_NPE_X_APISECRET: ""
    PROVIDER_PROD_URLS: ""
    PROVIDER_PROD_URL_LABELS: ""
    PROVIDER_PROD_URL_AUTH_TYPES: ""
    PROVIDER_PROD_URL_TLS_VERIFY: "true"
    # Per-env credentials for PROD — set via --set at deploy time
    PROVIDER_PROD_API_KEY: ""
    PROVIDER_PROD_ENTRA_TENANT_ID: ""
    PROVIDER_PROD_ENTRA_CLIENT_ID: ""
    PROVIDER_PROD_ENTRA_CLIENT_SECRET: ""
    PROVIDER_PROD_ENTRA_SCOPE: ""
    PROVIDER_PROD_X_APIKEY: ""
    PROVIDER_PROD_X_APISECRET: ""
    # ── Legacy mode (used when PROVIDER_ENVS is not set) ──────────────────────
    PROVIDER_URLS: ""
    PROVIDER_URL_LABELS: ""
    PROVIDER_AUTH_TYPE: none
    # ── Global credential fallbacks ───────────────────────────────────────────
    # Used when the matching PROVIDER_{ENV}_* var above is not set.
    # In legacy mode (PROVIDER_ENVS unset) these are the only credential vars.
    # Provider request timeout in milliseconds (minimum 10 000; default 15 000)
    PROVIDER_SKIP_TLS_VERIFY: "false"
    PROVIDER_TIMEOUT_MS: "15000"
    # For api-key auth — set via --set backend.env.PROVIDER_API_KEY=<key>
    PROVIDER_API_KEY: ""
    # For entraid-apigee auth — set all six via --set
    PROVIDER_ENTRA_TENANT_ID: ""
    PROVIDER_ENTRA_CLIENT_ID: ""
    PROVIDER_ENTRA_CLIENT_SECRET: ""
    PROVIDER_ENTRA_SCOPE: ""
    PROVIDER_X_APIKEY: ""
    PROVIDER_X_APISECRET: ""

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  # ── Payload encryption env vars ─────────────────────────────────────────────
  # Set via --set at deploy time — do not commit real values here.
  payloadEncryptionKey: ""         # set via --set backend.payloadEncryptionKey=<hex>
  payloadWriteAuthEnabled: "false" # set "true" to require Bearer token for saves
  payloadAdminToken: ""            # set via --set backend.payloadAdminToken=<token>

  # ── OPA Policy Generator (ABAC → Rego) ──────────────────────────────────────
  # GitHub configuration for fetching ABAC SQL policies
  opaGithubOwner: ffgdeo
  opaGithubRepo: uc-governance-demo
  opaGithubBranch: main
  opaGithubAbacPath: notebooks/04_row_filters_abac.py
  opaGithubFetchMode: api                    # "api" (private+public, 1MB limit) or "raw" (public only)
  opaGithubToken: ""                         # set via --set backend.opaGithubToken=<token>

  # OPA LLM configuration
  opaLlmModel: gpt-4o                        # model for ABAC → Rego conversion

  # OPA policy storage path (in container)
  opaPolicyStoragePath: /app/data/opa-policies

  # ── ABAC multi-environment support ──────────────────────────────────────────
  # Set ABAC_ENVS to enable multi-environment tree tabs in UI
  abacEnvs: ""                               # "DEV,NPE,PROD" or "" for single default env
  # Per-environment Git branch and path (set via --set for each env)
  abacDevBranch: dev
  abacDevBasePath: policies/dev/
  abacNpeBranch: npe
  abacNpeBasePath: policies/npe/
  abacProdBranch: main
  abacProdBasePath: policies/

  # ── Ranger Library — Rego → Apache Ranger Policy ──────────────────────────
  env:
    RANGER_ENVS: "DEV,NPE,PROD"           # tab strip; "" = single Default env
    RANGER_LLM_MODEL: "gpt-4o"            # falls back to OPA_LLM_MODEL → OPENAI_MODEL
    RANGER_POLICY_STORAGE_PATH: "/app/data/ranger-policies"
    # ── Governance Lifecycle — runtime-editable swimlane/RACI/SOP content ────
    GOVERNANCE_LIFECYCLE_STORAGE_PATH: "/app/data/governance-lifecycle"
    # ── Main app nav flags — bring Permission Checker / Identity Audit back
    # into this app's sidebar without a rebuild (both default hidden now
    # that Access Control is the dedicated surface for them) ────────────────
    MAIN_APP_SHOW_PERMISSION_CHECKER: "false"
    MAIN_APP_SHOW_IDENTITY_AUDIT: "false"
    # ── Pattern Templates — runtime-editable Mermaid diagram library ─────────
    PATTERN_TEMPLATES_STORAGE_PATH: "/app/data/pattern-templates"
    # ── Token Vault — multi-set bearer token provisioning (Entra ID, ForgeRock,
    # or any OAuth2 client-credentials vendor) ────────────────────────────────
    TOKEN_VAULT_ENVS: "DEV,NPE,PROD"      # tab strip; "" = single Default env
    TOKEN_VAULT_STORAGE_PATH: "/app/data/token-vault"
    RANGER_GITHUB_OWNER: ""
    RANGER_GITHUB_REPO: ""
    RANGER_GITHUB_REGO_PATH: ""
    RANGER_GITHUB_FETCH_MODE: "api"
    # ── Group Permission Evaluation ───────────────────────────────────────────
    USE_LLM: "false"                   # "true" reuses the OPENAI_API_KEY/OPENAI_BASE_URL client above
    PERMISSION_LLM_MODEL: ""           # falls back to OPENAI_MODEL when empty
    # Multi-environment mode — mirrors RANGER_ENVS. Empty (default) = single
    # "Default" env using secrets.kubernetes.databaseUrl below. Each env's real
    # database can use completely different table/column names — that's the
    # point; only override the *_TABLE/*_COLUMN values that actually differ.
    PERMISSION_ENVS: ""                          # e.g. "DEV,NPE,PROD"
    PERMISSION_DEV_DATABASE_URL: ""
    # SSL — "false" (default) works against a Postgres with no certificate
    # configured. Real managed Postgres (Azure Database for PostgreSQL, RDS,
    # etc.) almost always requires SSL and rejects plaintext connections with
    # "no pg_hba.conf entry ... no encryption" — set to "true" for those.
    PERMISSION_DEV_DB_SSL: "false"
    PERMISSION_NPE_DB_SSL: "false"
    PERMISSION_PROD_DB_SSL: "false"
    # Per-env schema-mapping vars — left blank here (Helm default).
    # PERMISSION_{ENV}_SCHEMA: optional Postgres schema prefix. When set, all
    # table references become "schema.tablename". Leave empty to resolve via
    # the connection's search_path (default).
    # PERMISSION_{ENV}_USER_SAM_COLUMN: when set, inputs without '@' are treated
    # as SAM accounts and looked up against this column instead of USER_KEY_COLUMN.
    PERMISSION_DEV_SCHEMA: ""
    PERMISSION_DEV_USERS_TABLE: ""
    PERMISSION_DEV_USER_KEY_COLUMN: ""
    PERMISSION_DEV_USER_SAM_COLUMN: ""
    PERMISSION_DEV_USER_LOCATION_COLUMN: ""
    PERMISSION_DEV_GROUPS_TABLE: ""
    PERMISSION_DEV_GROUP_KEY_COLUMN: ""
    PERMISSION_DEV_GROUP_LOCATION_COLUMN: ""
    PERMISSION_NPE_DATABASE_URL: ""
    PERMISSION_NPE_SCHEMA: ""
    PERMISSION_NPE_USERS_TABLE: ""
    PERMISSION_NPE_USER_KEY_COLUMN: ""
    PERMISSION_NPE_USER_SAM_COLUMN: ""
    PERMISSION_NPE_USER_LOCATION_COLUMN: ""
    PERMISSION_NPE_GROUPS_TABLE: ""
    PERMISSION_NPE_GROUP_KEY_COLUMN: ""
    PERMISSION_NPE_GROUP_LOCATION_COLUMN: ""
    PERMISSION_NPE_LOCATION_VALUE_MAP: ""
    PERMISSION_PROD_DATABASE_URL: ""
    PERMISSION_PROD_SCHEMA: ""
    PERMISSION_PROD_USERS_TABLE: ""
    PERMISSION_PROD_USER_KEY_COLUMN: ""
    PERMISSION_PROD_USER_SAM_COLUMN: ""
    PERMISSION_PROD_USER_LOCATION_COLUMN: ""
    PERMISSION_PROD_GROUPS_TABLE: ""
    PERMISSION_PROD_GROUP_KEY_COLUMN: ""
    PERMISSION_PROD_GROUP_LOCATION_COLUMN: ""
    PERMISSION_PROD_LOCATION_VALUE_MAP: ""
    # ── Identity Audit ─────────────────────────────────────────────────────────
    # Independent of USE_LLM above — separate feature, separate switch.
    IDENTITY_AUDIT_USE_LLM: "false"
    IDENTITY_AUDIT_LLM_MODEL: ""
    IDENTITY_AUDIT_ENVS: ""                       # e.g. "DEV,NPE,PROD"; empty = single "Default" env
    # Per-env Entra app registration (Microsoft Graph GroupMember.Read.All,
    # admin consent). Plain values, mirroring PROVIDER_{ENV}_ENTRA_* — not
    # routed through the K8s Secret/Key Vault CSI machinery, consistent with
    # how Provider API's per-env Entra credentials are already handled here.
    IDENTITY_AUDIT_DEV_TENANT_ID: ""
    IDENTITY_AUDIT_DEV_CLIENT_ID: ""
    IDENTITY_AUDIT_DEV_CLIENT_SECRET: ""
    IDENTITY_AUDIT_DEV_DEFAULT_FILTERS: ""
    IDENTITY_AUDIT_NPE_TENANT_ID: ""
    IDENTITY_AUDIT_NPE_CLIENT_ID: ""
    IDENTITY_AUDIT_NPE_CLIENT_SECRET: ""
    IDENTITY_AUDIT_NPE_DEFAULT_FILTERS: ""
    IDENTITY_AUDIT_PROD_TENANT_ID: ""
    IDENTITY_AUDIT_PROD_CLIENT_ID: ""
    IDENTITY_AUDIT_PROD_CLIENT_SECRET: ""
    IDENTITY_AUDIT_PROD_DEFAULT_FILTERS: ""

# ── Data storage (PVC) — every runtime-editable library feature ─────────────
# Single PVC mounted at /app/data/ covers all five:
#   - /app/data/payloads/             (Payload Library, encrypted)
#   - /app/data/opa-policies/         (OPA Policy Generator, encrypted)
#   - /app/data/ranger-policies/      (Ranger Library, encrypted)
#   - /app/data/governance-lifecycle/ (Governance Lifecycle, plain)
#   - /app/data/pattern-templates/    (Pattern Templates — Mermaid text or raw SVG, plain)
#   - /app/data/token-vault/          (Token Vault, encrypted)
# PATTERN_TEMPLATES_STORAGE_PATH (backend.env, below) already defaults to
# /app/data/pattern-templates — enabling dataStorage here is the only step
# needed for Pattern Templates content to survive pod restarts/reschedules;
# no separate PVC or mount is required for that feature.
dataStorage:
  enabled: false          # set true in staging/prod values overlay
  storageClass: ""        # empty = use cluster default StorageClass
  size: 5Gi               # covers payloads + OPA/Ranger policies + governance config + pattern templates
  mountPath: /app/data    # every feature above is a subdirectory of this one mount

# ── Legacy: payloadStorage (deprecated, use dataStorage) ────────────────────────
# Kept for backward compatibility; replaced by dataStorage above
payloadStorage:
  enabled: false          # use dataStorage.enabled instead
  storageClass: ""
  size: 1Gi
  mountPath: /app/data/payloads

# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  image: pattern-frontend
  tag: latest
  replicas: 1
  port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Sensec HSM Demo — optional dev-cluster proxy ───────────────────────────────
# The HSM encryption service is independently deployed (its own Helm chart),
# never part of this chart. In real AKS/Istio environments, the Istio
# VirtualService for /api/sensec/hsm routes directly to that service's own
# pod — this frontend's nginx never sees the request, and hsmService.url
# should stay empty.
#
# Set hsmService.url only for non-Istio test/dev clusters (e.g. local kind/minikube)
# where you want the frontend's nginx to proxy /api/sensec/hsm/ to a reachable
# HSM service instance, mirroring the docker-compose local-dev convenience.
hsmService:
  url: ""   # e.g. "http://hsm-encryption-service.hsm.svc.cluster.local:3005"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx                     # or "azure/application-gateway"
  host: app.yourdomain.com
  tls:
    enabled: false
    secretName: pattern-tls
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # Must be >= frontend nginx's own ranger-generate timeout (300s, see
    # frontend/nginx.conf's `^~ /api/pattern/assessment/ranger-` block) —
    # the Ingress sits in front of nginx, so a shorter Ingress-level timeout
    # aborts the connection first and returns a bare 504 with no body,
    # regardless of how generous nginx's own timeout is set. Without an
    # explicit value here, the nginx-ingress-controller's own default (60s)
    # applies silently.
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

# ── Secrets ───────────────────────────────────────────────────────────────────
secrets:
  # "kubernetes" — plain K8s Secret (dev / staging)
  # "azure-keyvault" — Azure Key Vault CSI driver (production)
  provider: kubernetes

  kubernetes:
    openaiApiKey: ""                   # set via --set secrets.kubernetes.openaiApiKey=sk-...
    # Group Permission Evaluation — expects an externally managed Postgres
    # (e.g. Azure Database for PostgreSQL Flexible Server), not an in-cluster
    # database. Leave empty to omit DATABASE_URL entirely (feature unusable
    # but the rest of the app is unaffected). See docs/adr/0015.
    databaseUrl: ""                    # set via --set secrets.kubernetes.databaseUrl=postgresql://...

  azureKeyVault:
    enabled: false
    keyvaultName: ""                   # e.g. my-keyvault
    tenantId: ""
    userAssignedIdentityID: ""         # managed identity client ID
    secretName: openai-api-key         # name of the secret inside Key Vault
    databaseSecretName: ""             # name of the DATABASE_URL secret inside Key Vault (optional)

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  # For AKS Workload Identity, add:
  #   azure.workload.identity/client-id: "<managed-identity-client-id>"

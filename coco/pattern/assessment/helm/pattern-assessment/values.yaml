# ── values.yaml — default values (safe for local / CI preview) ────────────────
# Override per environment with values-staging.yaml / values-prod.yaml

global:
  registry: myacr.azurecr.io          # Azure Container Registry hostname
  imagePullPolicy: IfNotPresent

nameOverride: ""

# ── Backend ───────────────────────────────────────────────────────────────────
backend:
  image: pattern-backend
  tag: latest
  replicas: 1
  port: 3001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  env:
    OPENAI_MODEL: gpt-4o-mini
    FRONTEND_URL: "http://localhost"   # overridden per environment

    # ── Provider API (Payload Library "Run" feature) ──────────────────────────
    # Comma-separated list of pre-configured provider URLs shown in the dropdown.
    # Leave empty to show only the custom URL input in the UI.
    PROVIDER_URLS: ""
    # Display labels matching each URL above (same count; falls back to "Provider N")
    PROVIDER_URL_LABELS: ""
    # Auth mode: none | x-api-key | entraid-apigee | payload-embedded
    PROVIDER_AUTH_TYPE: none
    # Provider request timeout in milliseconds (minimum 10 000; default 15 000)
    PROVIDER_TIMEOUT_MS: "15000"
    # For x-api-key auth — set via --set backend.env.PROVIDER_API_KEY=<key>
    PROVIDER_API_KEY: ""
    # For entraid-apigee auth — set all six via --set
    PROVIDER_ENTRA_TENANT_ID: ""
    PROVIDER_ENTRA_CLIENT_ID: ""
    PROVIDER_ENTRA_CLIENT_SECRET: ""
    PROVIDER_ENTRA_SCOPE: ""
    PROVIDER_X_APIKEY: ""
    PROVIDER_X_APISECRET: ""

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  image: pattern-frontend
  tag: latest
  replicas: 1
  port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx                     # or "azure/application-gateway"
  host: app.yourdomain.com
  tls:
    enabled: false
    secretName: pattern-tls
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

# ── Secrets ───────────────────────────────────────────────────────────────────
secrets:
  # "kubernetes" — plain K8s Secret (dev / staging)
  # "azure-keyvault" — Azure Key Vault CSI driver (production)
  provider: kubernetes

  kubernetes:
    openaiApiKey: ""                   # set via --set secrets.kubernetes.openaiApiKey=sk-...

  azureKeyVault:
    enabled: false
    keyvaultName: ""                   # e.g. my-keyvault
    tenantId: ""
    userAssignedIdentityID: ""         # managed identity client ID
    secretName: openai-api-key         # name of the secret inside Key Vault

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  # For AKS Workload Identity, add:
  #   azure.workload.identity/client-id: "<managed-identity-client-id>"

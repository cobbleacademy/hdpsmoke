# nginx.conf rendered as a ConfigMap.
# The /api/ proxy_pass uses the Kubernetes DNS name of the backend Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pattern-assessment.frontend.name" . }}-nginx-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.frontend.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;

      add_header X-Frame-Options         SAMEORIGIN;
      add_header X-Content-Type-Options  nosniff;
      add_header Referrer-Policy         strict-origin-when-cross-origin;

      location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      location = /api/pattern/assessment/questions {
        proxy_pass         http://{{ include "pattern-assessment.backend.name" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
      }

      location = /api/pattern/assessment/submit {
        proxy_pass         http://{{ include "pattern-assessment.backend.name" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
      }

      location = /api/pattern/assessment/provider-config {
        proxy_pass         http://{{ include "pattern-assessment.backend.name" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
      }

      location = /api/pattern/assessment/run-payload {
        proxy_pass         http://{{ include "pattern-assessment.backend.name" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
      }

      location ^~ /api/pattern/assessment/ranger- {
        proxy_pass         http://{{ include "pattern-assessment.backend.name" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        client_max_body_size  5m;
      }

      location ^~ /api/pattern/assessment/payload-content/ {
        proxy_pass         http://{{ include "pattern-assessment.backend.name" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        client_max_body_size  2m;
      }

      location ^~ /api/pattern/assessment/opa- {
        proxy_pass         http://{{ include "pattern-assessment.backend.name" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # OPA generation can take time (LLM calls). Local/Ollama CPU inference for
        # larger prompts can run several minutes — keep this generous. OpenAI-backed
        # generation typically completes in well under 60s.
        proxy_read_timeout    300s;
        client_max_body_size  5m;
      }

      location ^~ /api/pattern/assessment/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control         "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
      }

      location ^~ /api/pattern/assessment/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ @spa;
        add_header Cache-Control         "no-cache";
        add_header X-Frame-Options       SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy       strict-origin-when-cross-origin;
      }

      location @spa {
        try_files /index.html =404;
        add_header Cache-Control         "no-cache";
        add_header X-Frame-Options       SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy       strict-origin-when-cross-origin;
      }

      gzip on;
      gzip_types text/plain text/css application/json application/javascript
                 text/javascript image/svg+xml;
      gzip_min_length 1024;
    }

{{- if .Values.secrets.azureKeyVault.enabled }}
# Azure Key Vault CSI SecretProviderClass — used when secrets.provider: azure-keyvault.
# Requires the AKS Secrets Store CSI driver add-on:
#   az aks enable-addons --addons azure-keyvault-secrets-provider --name <cluster>
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pattern-secrets-provider
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.secrets.azureKeyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.secrets.azureKeyVault.keyvaultName | quote }}
    tenantId: {{ .Values.secrets.azureKeyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.secrets.azureKeyVault.secretName }}
          objectType: secret
        {{- if .Values.secrets.azureKeyVault.databaseSecretName }}
        - |
          objectName: {{ .Values.secrets.azureKeyVault.databaseSecretName }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: pattern-secrets
      type: Opaque
      data:
        - objectName: {{ .Values.secrets.azureKeyVault.secretName }}
          key: OPENAI_API_KEY
        {{- if .Values.secrets.azureKeyVault.databaseSecretName }}
        # Group Permission Evaluation — DATABASE_URL stored in Key Vault under
        # this secret name; expects an externally managed Postgres instance.
        - objectName: {{ .Values.secrets.azureKeyVault.databaseSecretName }}
          key: DATABASE_URL
        {{- end }}
{{- end }}

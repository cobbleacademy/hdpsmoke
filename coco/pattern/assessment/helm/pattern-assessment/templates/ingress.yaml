{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pattern-assessment.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # All traffic goes to the frontend nginx, which proxies /api/* to backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pattern-assessment.frontend.name" . }}
                port:
                  name: http
{{- end }}

{{- if or .Values.dataStorage.enabled .Values.payloadStorage.enabled }}
# PersistentVolumeClaim for runtime-editable content storage.
# A single volume, mounted once at /app/data, backs every "runtime-editable
# library" feature — each gets its own subdirectory (some encrypted, some not):
#   1. /app/data/payloads/            — {envId}.enc files (Payload Library, encrypted)
#   2. /app/data/opa-policies/        — manifest.json + {policyKey}.enc (OPA Policy Generator, encrypted)
#   3. /app/data/ranger-policies/     — manifest.json + {policyKey}.enc (Ranger Library, encrypted)
#   4. /app/data/governance-lifecycle/ — config.json (Governance Lifecycle, plain)
#   5. /app/data/pattern-templates/   — manifest.json + {id}.mmd files, Mermaid text or raw SVG (Pattern Templates, plain)
#
# NOTE: ReadWriteOnce is sufficient for single-pod deployments.
# If HPA scales the backend to multiple pods on different nodes,
# switch to ReadWriteMany and use a StorageClass that supports it
# (e.g. Azure Files, NFS, or a CSI driver).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  {{- if .Values.dataStorage.enabled }}
  name: {{ include "pattern-assessment.backend.name" . }}-data-storage
  {{- else }}
  name: {{ include "pattern-assessment.backend.name" . }}-payload-storage
  {{- end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.backend.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      {{- if .Values.dataStorage.enabled }}
      storage: {{ .Values.dataStorage.size | default "5Gi" }}
      {{- else }}
      storage: {{ .Values.payloadStorage.size | default "1Gi" }}
      {{- end }}
  {{- if .Values.dataStorage.enabled }}
    {{- if .Values.dataStorage.storageClass }}
  storageClassName: {{ .Values.dataStorage.storageClass }}
    {{- end }}
  {{- else }}
    {{- if .Values.payloadStorage.storageClass }}
  storageClassName: {{ .Values.payloadStorage.storageClass }}
    {{- end }}
  {{- end }}
{{- end }}

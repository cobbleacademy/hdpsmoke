apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pattern-assessment.backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "pattern-assessment.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pattern-assessment.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pattern-assessment.serviceAccountName" . }}

      # Spread pods across availability zones for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pattern-assessment.backend.selectorLabels" . | nindent 14 }}

      containers:
        - name: backend
          image: {{ include "pattern-assessment.backend.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: NODE_ENV
              value: production
            - name: OPENAI_MODEL
              value: {{ .Values.backend.env.OPENAI_MODEL | quote }}
            {{- if .Values.backend.env.OPENAI_BASE_URL }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.backend.env.OPENAI_BASE_URL | quote }}
            {{- end }}

            # ── LLM gateway — per-environment overrides (DEV/NPE/PROD) ───────
            # Shared across OPA Generator, Ranger Library, Identity Audit, and
            # Permission Checker — each falls back to the global OPENAI_* vars
            # above when unset for that environment.
            {{- range $env := list "DEV" "NPE" "PROD" }}
            {{- if index $.Values.backend.env (printf "LLM_%s_OPENAI_BASE_URL" $env) }}
            - name: LLM_{{ $env }}_OPENAI_BASE_URL
              value: {{ index $.Values.backend.env (printf "LLM_%s_OPENAI_BASE_URL" $env) | quote }}
            {{- end }}
            {{- if index $.Values.backend.env (printf "LLM_%s_OPENAI_API_KEY" $env) }}
            - name: LLM_{{ $env }}_OPENAI_API_KEY
              value: {{ index $.Values.backend.env (printf "LLM_%s_OPENAI_API_KEY" $env) | quote }}
            {{- end }}
            {{- if index $.Values.backend.env (printf "LLM_%s_OPENAI_MODEL" $env) }}
            - name: LLM_{{ $env }}_OPENAI_MODEL
              value: {{ index $.Values.backend.env (printf "LLM_%s_OPENAI_MODEL" $env) | quote }}
            {{- end }}
            {{- if index $.Values.backend.env (printf "LLM_%s_OPENAI_EXTRA_HEADERS" $env) }}
            - name: LLM_{{ $env }}_OPENAI_EXTRA_HEADERS
              value: {{ index $.Values.backend.env (printf "LLM_%s_OPENAI_EXTRA_HEADERS" $env) | quote }}
            {{- end }}
            {{- if index $.Values.backend.env (printf "LLM_%s_OPENAI_OMIT_TEMPERATURE" $env) }}
            - name: LLM_{{ $env }}_OPENAI_OMIT_TEMPERATURE
              value: {{ index $.Values.backend.env (printf "LLM_%s_OPENAI_OMIT_TEMPERATURE" $env) | quote }}
            {{- end }}
            {{- if index $.Values.backend.env (printf "LLM_%s_OPENAI_MAX_TOKENS_PARAM" $env) }}
            - name: LLM_{{ $env }}_OPENAI_MAX_TOKENS_PARAM
              value: {{ index $.Values.backend.env (printf "LLM_%s_OPENAI_MAX_TOKENS_PARAM" $env) | quote }}
            {{- end }}
            {{- if index $.Values.backend.env (printf "LLM_%s_OPENAI_REASONING_EFFORT" $env) }}
            - name: LLM_{{ $env }}_OPENAI_REASONING_EFFORT
              value: {{ index $.Values.backend.env (printf "LLM_%s_OPENAI_REASONING_EFFORT" $env) | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.backend.env.NODE_EXTRA_CA_CERTS }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ .Values.backend.env.NODE_EXTRA_CA_CERTS | quote }}
            {{- end }}
            - name: FRONTEND_URL
              value: {{ .Values.backend.env.FRONTEND_URL | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pattern-secrets
                  key: OPENAI_API_KEY

            # ── Provider API — tab mode ─────────────────────────────────────
            - name: PROVIDER_ENVS
              value: {{ .Values.backend.env.PROVIDER_ENVS | quote }}
            - name: PROVIDER_ENV_PAYLOAD_FILES
              value: {{ .Values.backend.env.PROVIDER_ENV_PAYLOAD_FILES | quote }}
            # ADM-DEV — URL triplet + per-env credentials
            - name: PROVIDER_ADM_DEV_URLS
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_URLS | quote }}
            - name: PROVIDER_ADM_DEV_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_URL_LABELS | quote }}
            - name: PROVIDER_ADM_DEV_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_URL_AUTH_TYPES | quote }}
            - name: PROVIDER_ADM_DEV_URL_TLS_VERIFY
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_URL_TLS_VERIFY | default "true" | quote }}
            - name: PROVIDER_ADM_DEV_API_KEY
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_API_KEY | quote }}
            - name: PROVIDER_ADM_DEV_ENTRA_TENANT_ID
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_ENTRA_TENANT_ID | quote }}
            - name: PROVIDER_ADM_DEV_ENTRA_CLIENT_ID
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_ENTRA_CLIENT_ID | quote }}
            - name: PROVIDER_ADM_DEV_ENTRA_CLIENT_SECRET
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_ENTRA_CLIENT_SECRET | quote }}
            - name: PROVIDER_ADM_DEV_ENTRA_SCOPE
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_ENTRA_SCOPE | quote }}
            - name: PROVIDER_ADM_DEV_X_APIKEY
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_X_APIKEY | quote }}
            - name: PROVIDER_ADM_DEV_X_APISECRET
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_X_APISECRET | quote }}
            # DEV — URL triplet + per-env credentials
            - name: PROVIDER_DEV_URLS
              value: {{ .Values.backend.env.PROVIDER_DEV_URLS | quote }}
            - name: PROVIDER_DEV_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_DEV_URL_LABELS | quote }}
            - name: PROVIDER_DEV_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_DEV_URL_AUTH_TYPES | quote }}
            - name: PROVIDER_DEV_URL_TLS_VERIFY
              value: {{ .Values.backend.env.PROVIDER_DEV_URL_TLS_VERIFY | default "true" | quote }}
            - name: PROVIDER_DEV_API_KEY
              value: {{ .Values.backend.env.PROVIDER_DEV_API_KEY | quote }}
            - name: PROVIDER_DEV_ENTRA_TENANT_ID
              value: {{ .Values.backend.env.PROVIDER_DEV_ENTRA_TENANT_ID | quote }}
            - name: PROVIDER_DEV_ENTRA_CLIENT_ID
              value: {{ .Values.backend.env.PROVIDER_DEV_ENTRA_CLIENT_ID | quote }}
            - name: PROVIDER_DEV_ENTRA_CLIENT_SECRET
              value: {{ .Values.backend.env.PROVIDER_DEV_ENTRA_CLIENT_SECRET | quote }}
            - name: PROVIDER_DEV_ENTRA_SCOPE
              value: {{ .Values.backend.env.PROVIDER_DEV_ENTRA_SCOPE | quote }}
            - name: PROVIDER_DEV_X_APIKEY
              value: {{ .Values.backend.env.PROVIDER_DEV_X_APIKEY | quote }}
            - name: PROVIDER_DEV_X_APISECRET
              value: {{ .Values.backend.env.PROVIDER_DEV_X_APISECRET | quote }}
            # NPE — URL triplet + per-env credentials
            - name: PROVIDER_NPE_URLS
              value: {{ .Values.backend.env.PROVIDER_NPE_URLS | quote }}
            - name: PROVIDER_NPE_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_NPE_URL_LABELS | quote }}
            - name: PROVIDER_NPE_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_NPE_URL_AUTH_TYPES | quote }}
            - name: PROVIDER_NPE_URL_TLS_VERIFY
              value: {{ .Values.backend.env.PROVIDER_NPE_URL_TLS_VERIFY | default "true" | quote }}
            - name: PROVIDER_NPE_API_KEY
              value: {{ .Values.backend.env.PROVIDER_NPE_API_KEY | quote }}
            - name: PROVIDER_NPE_ENTRA_TENANT_ID
              value: {{ .Values.backend.env.PROVIDER_NPE_ENTRA_TENANT_ID | quote }}
            - name: PROVIDER_NPE_ENTRA_CLIENT_ID
              value: {{ .Values.backend.env.PROVIDER_NPE_ENTRA_CLIENT_ID | quote }}
            - name: PROVIDER_NPE_ENTRA_CLIENT_SECRET
              value: {{ .Values.backend.env.PROVIDER_NPE_ENTRA_CLIENT_SECRET | quote }}
            - name: PROVIDER_NPE_ENTRA_SCOPE
              value: {{ .Values.backend.env.PROVIDER_NPE_ENTRA_SCOPE | quote }}
            - name: PROVIDER_NPE_X_APIKEY
              value: {{ .Values.backend.env.PROVIDER_NPE_X_APIKEY | quote }}
            - name: PROVIDER_NPE_X_APISECRET
              value: {{ .Values.backend.env.PROVIDER_NPE_X_APISECRET | quote }}
            # PROD — URL triplet + per-env credentials
            - name: PROVIDER_PROD_URLS
              value: {{ .Values.backend.env.PROVIDER_PROD_URLS | quote }}
            - name: PROVIDER_PROD_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_PROD_URL_LABELS | quote }}
            - name: PROVIDER_PROD_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_PROD_URL_AUTH_TYPES | quote }}
            - name: PROVIDER_PROD_URL_TLS_VERIFY
              value: {{ .Values.backend.env.PROVIDER_PROD_URL_TLS_VERIFY | default "true" | quote }}
            - name: PROVIDER_PROD_API_KEY
              value: {{ .Values.backend.env.PROVIDER_PROD_API_KEY | quote }}
            - name: PROVIDER_PROD_ENTRA_TENANT_ID
              value: {{ .Values.backend.env.PROVIDER_PROD_ENTRA_TENANT_ID | quote }}
            - name: PROVIDER_PROD_ENTRA_CLIENT_ID
              value: {{ .Values.backend.env.PROVIDER_PROD_ENTRA_CLIENT_ID | quote }}
            - name: PROVIDER_PROD_ENTRA_CLIENT_SECRET
              value: {{ .Values.backend.env.PROVIDER_PROD_ENTRA_CLIENT_SECRET | quote }}
            - name: PROVIDER_PROD_ENTRA_SCOPE
              value: {{ .Values.backend.env.PROVIDER_PROD_ENTRA_SCOPE | quote }}
            - name: PROVIDER_PROD_X_APIKEY
              value: {{ .Values.backend.env.PROVIDER_PROD_X_APIKEY | quote }}
            - name: PROVIDER_PROD_X_APISECRET
              value: {{ .Values.backend.env.PROVIDER_PROD_X_APISECRET | quote }}
            # ── Legacy mode (backward compat when PROVIDER_ENVS not set) ───
            - name: PROVIDER_URLS
              value: {{ .Values.backend.env.PROVIDER_URLS | quote }}
            - name: PROVIDER_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_URL_LABELS | quote }}
            - name: PROVIDER_AUTH_TYPE
              value: {{ .Values.backend.env.PROVIDER_AUTH_TYPE | quote }}
            # ── Global credential fallbacks ─────────────────────────────────
            - name: PROVIDER_SKIP_TLS_VERIFY
              value: {{ .Values.backend.env.PROVIDER_SKIP_TLS_VERIFY | default "false" | quote }}
            - name: PROVIDER_TIMEOUT_MS
              value: {{ .Values.backend.env.PROVIDER_TIMEOUT_MS | quote }}
            - name: PROVIDER_API_KEY
              value: {{ .Values.backend.env.PROVIDER_API_KEY | quote }}
            - name: PROVIDER_ENTRA_TENANT_ID
              value: {{ .Values.backend.env.PROVIDER_ENTRA_TENANT_ID | quote }}
            - name: PROVIDER_ENTRA_CLIENT_ID
              value: {{ .Values.backend.env.PROVIDER_ENTRA_CLIENT_ID | quote }}
            - name: PROVIDER_ENTRA_CLIENT_SECRET
              value: {{ .Values.backend.env.PROVIDER_ENTRA_CLIENT_SECRET | quote }}
            - name: PROVIDER_ENTRA_SCOPE
              value: {{ .Values.backend.env.PROVIDER_ENTRA_SCOPE | quote }}
            - name: PROVIDER_X_APIKEY
              value: {{ .Values.backend.env.PROVIDER_X_APIKEY | quote }}
            - name: PROVIDER_X_APISECRET
              value: {{ .Values.backend.env.PROVIDER_X_APISECRET | quote }}

            # ── Payload encryption ─────────────────────────────────────────
            - name: PAYLOAD_ENCRYPTION_KEY
              value: {{ .Values.backend.payloadEncryptionKey | quote }}
            - name: PAYLOAD_STORAGE_PATH
              value: {{ .Values.payloadStorage.mountPath | default "/app/data/payloads" | quote }}
            - name: PAYLOAD_WRITE_AUTH_ENABLED
              value: {{ .Values.backend.payloadWriteAuthEnabled | default "false" | quote }}
            - name: PAYLOAD_ADMIN_TOKEN
              value: {{ .Values.backend.payloadAdminToken | quote }}

            # ── OPA Policy Generator (ABAC → Rego) ─────────────────────────
            - name: GITHUB_DEFAULT_OWNER
              value: {{ .Values.backend.opaGithubOwner | default "ffgdeo" | quote }}
            - name: GITHUB_DEFAULT_REPO
              value: {{ .Values.backend.opaGithubRepo | default "uc-governance-demo" | quote }}
            - name: GITHUB_DEFAULT_BRANCH
              value: {{ .Values.backend.opaGithubBranch | default "main" | quote }}
            - name: GITHUB_DEFAULT_ABAC_PATH
              value: {{ .Values.backend.opaGithubAbacPath | default "notebooks/04_row_filters_abac.py" | quote }}
            - name: GITHUB_DEFAULT_FETCH_MODE
              value: {{ .Values.backend.opaGithubFetchMode | default "api" | quote }}
            - name: GITHUB_TOKEN
              value: {{ .Values.backend.opaGithubToken | default "" | quote }}
            - name: OPA_LLM_MODEL
              value: {{ .Values.backend.opaLlmModel | default "gpt-4o" | quote }}
            - name: OPA_POLICY_STORAGE_PATH
              value: {{ .Values.backend.opaPolicyStoragePath | default "/app/data/opa-policies" | quote }}

            # ── ABAC multi-environment support ──────────────────────────────
            - name: ABAC_ENVS
              value: {{ .Values.backend.abacEnvs | default "" | quote }}
            - name: ABAC_DEV_BRANCH
              value: {{ .Values.backend.abacDevBranch | default "dev" | quote }}
            - name: ABAC_DEV_BASE_PATH
              value: {{ .Values.backend.abacDevBasePath | default "policies/dev/" | quote }}
            - name: ABAC_NPE_BRANCH
              value: {{ .Values.backend.abacNpeBranch | default "npe" | quote }}
            - name: ABAC_NPE_BASE_PATH
              value: {{ .Values.backend.abacNpeBasePath | default "policies/npe/" | quote }}
            - name: ABAC_PROD_BRANCH
              value: {{ .Values.backend.abacProdBranch | default "main" | quote }}
            - name: ABAC_PROD_BASE_PATH
              value: {{ .Values.backend.abacProdBasePath | default "policies/" | quote }}

            # ── Ranger Library ────────────────────────────────────────────────
            - name: RANGER_ENVS
              value: {{ .Values.backend.env.RANGER_ENVS | default "DEV,NPE,PROD" | quote }}
            - name: RANGER_LLM_MODEL
              value: {{ .Values.backend.env.RANGER_LLM_MODEL | default "gpt-4o" | quote }}
            - name: RANGER_POLICY_STORAGE_PATH
              value: {{ .Values.backend.env.RANGER_POLICY_STORAGE_PATH | default "/app/data/ranger-policies" | quote }}

            # ── Governance Lifecycle ─────────────────────────────────────────────
            - name: GOVERNANCE_LIFECYCLE_STORAGE_PATH
              value: {{ .Values.backend.env.GOVERNANCE_LIFECYCLE_STORAGE_PATH | default "/app/data/governance-lifecycle" | quote }}

            # ── Main app nav flags ────────────────────────────────────────────────
            - name: MAIN_APP_SHOW_PERMISSION_CHECKER
              value: {{ .Values.backend.env.MAIN_APP_SHOW_PERMISSION_CHECKER | default "false" | quote }}
            - name: MAIN_APP_SHOW_IDENTITY_AUDIT
              value: {{ .Values.backend.env.MAIN_APP_SHOW_IDENTITY_AUDIT | default "false" | quote }}

            # ── Pattern Templates ─────────────────────────────────────────────────
            - name: PATTERN_TEMPLATES_STORAGE_PATH
              value: {{ .Values.backend.env.PATTERN_TEMPLATES_STORAGE_PATH | default "/app/data/pattern-templates" | quote }}

            # ── Token Vault ───────────────────────────────────────────────────────
            - name: TOKEN_VAULT_ENVS
              value: {{ .Values.backend.env.TOKEN_VAULT_ENVS | default "DEV,NPE,PROD" | quote }}
            - name: TOKEN_VAULT_STORAGE_PATH
              value: {{ .Values.backend.env.TOKEN_VAULT_STORAGE_PATH | default "/app/data/token-vault" | quote }}
            {{- if .Values.backend.env.RANGER_GITHUB_OWNER }}
            - name: RANGER_GITHUB_OWNER
              value: {{ .Values.backend.env.RANGER_GITHUB_OWNER | quote }}
            {{- end }}
            {{- if .Values.backend.env.RANGER_GITHUB_REPO }}
            - name: RANGER_GITHUB_REPO
              value: {{ .Values.backend.env.RANGER_GITHUB_REPO | quote }}
            {{- end }}
            {{- if .Values.backend.env.RANGER_GITHUB_REGO_PATH }}
            - name: RANGER_GITHUB_REGO_PATH
              value: {{ .Values.backend.env.RANGER_GITHUB_REGO_PATH | quote }}
            {{- end }}
            - name: RANGER_GITHUB_FETCH_MODE
              value: {{ .Values.backend.env.RANGER_GITHUB_FETCH_MODE | default "api" | quote }}
            # ── Group Permission Evaluation ───────────────────────────────────
            - name: USE_LLM
              value: {{ .Values.backend.env.USE_LLM | default "false" | quote }}
            {{- if .Values.backend.env.PERMISSION_LLM_MODEL }}
            - name: PERMISSION_LLM_MODEL
              value: {{ .Values.backend.env.PERMISSION_LLM_MODEL | quote }}
            {{- end }}
            {{- if .Values.secrets.kubernetes.databaseUrl }}
            # Single-env ("Default") mode — only used when PERMISSION_ENVS below is empty.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pattern-secrets
                  key: DATABASE_URL
            {{- end }}
            # ── Group Permission Evaluation — multi-environment mode ─────────
            # Mirrors RANGER_ENVS: set to enable the tab-per-environment UI.
            # Per-env connection strings follow the same plain backend.env.*
            # pattern as PROVIDER_{ENV}_* — operators supply real secrets via
            # --set from their own shell, consistent with how Provider API
            # credentials are already handled in this chart.
            - name: PERMISSION_ENVS
              value: {{ .Values.backend.env.PERMISSION_ENVS | quote }}
            - name: PERMISSION_DEV_DATABASE_URL
              value: {{ .Values.backend.env.PERMISSION_DEV_DATABASE_URL | quote }}
            - name: PERMISSION_DEV_DB_SSL
              value: {{ .Values.backend.env.PERMISSION_DEV_DB_SSL | default "false" | quote }}
            - name: PERMISSION_NPE_DB_SSL
              value: {{ .Values.backend.env.PERMISSION_NPE_DB_SSL | default "false" | quote }}
            - name: PERMISSION_PROD_DB_SSL
              value: {{ .Values.backend.env.PERMISSION_PROD_DB_SSL | default "false" | quote }}
            - name: PERMISSION_DEV_SCHEMA
              value: {{ .Values.backend.env.PERMISSION_DEV_SCHEMA | quote }}
            - name: PERMISSION_DEV_USERS_TABLE
              value: {{ .Values.backend.env.PERMISSION_DEV_USERS_TABLE | quote }}
            - name: PERMISSION_DEV_USER_KEY_COLUMN
              value: {{ .Values.backend.env.PERMISSION_DEV_USER_KEY_COLUMN | quote }}
            - name: PERMISSION_DEV_USER_SAM_COLUMN
              value: {{ .Values.backend.env.PERMISSION_DEV_USER_SAM_COLUMN | quote }}
            - name: PERMISSION_DEV_USER_LOCATION_COLUMN
              value: {{ .Values.backend.env.PERMISSION_DEV_USER_LOCATION_COLUMN | quote }}
            - name: PERMISSION_DEV_GROUPS_TABLE
              value: {{ .Values.backend.env.PERMISSION_DEV_GROUPS_TABLE | quote }}
            - name: PERMISSION_DEV_GROUP_KEY_COLUMN
              value: {{ .Values.backend.env.PERMISSION_DEV_GROUP_KEY_COLUMN | quote }}
            - name: PERMISSION_DEV_GROUP_LOCATION_COLUMN
              value: {{ .Values.backend.env.PERMISSION_DEV_GROUP_LOCATION_COLUMN | quote }}
            - name: PERMISSION_NPE_DATABASE_URL
              value: {{ .Values.backend.env.PERMISSION_NPE_DATABASE_URL | quote }}
            - name: PERMISSION_NPE_SCHEMA
              value: {{ .Values.backend.env.PERMISSION_NPE_SCHEMA | quote }}
            - name: PERMISSION_NPE_USERS_TABLE
              value: {{ .Values.backend.env.PERMISSION_NPE_USERS_TABLE | quote }}
            - name: PERMISSION_NPE_USER_KEY_COLUMN
              value: {{ .Values.backend.env.PERMISSION_NPE_USER_KEY_COLUMN | quote }}
            - name: PERMISSION_NPE_USER_SAM_COLUMN
              value: {{ .Values.backend.env.PERMISSION_NPE_USER_SAM_COLUMN | quote }}
            - name: PERMISSION_NPE_USER_LOCATION_COLUMN
              value: {{ .Values.backend.env.PERMISSION_NPE_USER_LOCATION_COLUMN | quote }}
            - name: PERMISSION_NPE_GROUPS_TABLE
              value: {{ .Values.backend.env.PERMISSION_NPE_GROUPS_TABLE | quote }}
            - name: PERMISSION_NPE_GROUP_KEY_COLUMN
              value: {{ .Values.backend.env.PERMISSION_NPE_GROUP_KEY_COLUMN | quote }}
            - name: PERMISSION_NPE_GROUP_LOCATION_COLUMN
              value: {{ .Values.backend.env.PERMISSION_NPE_GROUP_LOCATION_COLUMN | quote }}
            - name: PERMISSION_NPE_LOCATION_VALUE_MAP
              value: {{ .Values.backend.env.PERMISSION_NPE_LOCATION_VALUE_MAP | quote }}
            - name: PERMISSION_PROD_DATABASE_URL
              value: {{ .Values.backend.env.PERMISSION_PROD_DATABASE_URL | quote }}
            - name: PERMISSION_PROD_SCHEMA
              value: {{ .Values.backend.env.PERMISSION_PROD_SCHEMA | quote }}
            - name: PERMISSION_PROD_USERS_TABLE
              value: {{ .Values.backend.env.PERMISSION_PROD_USERS_TABLE | quote }}
            - name: PERMISSION_PROD_USER_KEY_COLUMN
              value: {{ .Values.backend.env.PERMISSION_PROD_USER_KEY_COLUMN | quote }}
            - name: PERMISSION_PROD_USER_SAM_COLUMN
              value: {{ .Values.backend.env.PERMISSION_PROD_USER_SAM_COLUMN | quote }}
            - name: PERMISSION_PROD_USER_LOCATION_COLUMN
              value: {{ .Values.backend.env.PERMISSION_PROD_USER_LOCATION_COLUMN | quote }}
            - name: PERMISSION_PROD_GROUPS_TABLE
              value: {{ .Values.backend.env.PERMISSION_PROD_GROUPS_TABLE | quote }}
            - name: PERMISSION_PROD_GROUP_KEY_COLUMN
              value: {{ .Values.backend.env.PERMISSION_PROD_GROUP_KEY_COLUMN | quote }}
            - name: PERMISSION_PROD_GROUP_LOCATION_COLUMN
              value: {{ .Values.backend.env.PERMISSION_PROD_GROUP_LOCATION_COLUMN | quote }}
            - name: PERMISSION_PROD_LOCATION_VALUE_MAP
              value: {{ .Values.backend.env.PERMISSION_PROD_LOCATION_VALUE_MAP | quote }}
            # ── Identity Audit ─────────────────────────────────────────────────
            - name: IDENTITY_AUDIT_USE_LLM
              value: {{ .Values.backend.env.IDENTITY_AUDIT_USE_LLM | default "false" | quote }}
            {{- if .Values.backend.env.IDENTITY_AUDIT_LLM_MODEL }}
            - name: IDENTITY_AUDIT_LLM_MODEL
              value: {{ .Values.backend.env.IDENTITY_AUDIT_LLM_MODEL | quote }}
            {{- end }}
            - name: IDENTITY_AUDIT_ENVS
              value: {{ .Values.backend.env.IDENTITY_AUDIT_ENVS | quote }}
            - name: IDENTITY_AUDIT_DEV_TENANT_ID
              value: {{ .Values.backend.env.IDENTITY_AUDIT_DEV_TENANT_ID | quote }}
            - name: IDENTITY_AUDIT_DEV_CLIENT_ID
              value: {{ .Values.backend.env.IDENTITY_AUDIT_DEV_CLIENT_ID | quote }}
            - name: IDENTITY_AUDIT_DEV_CLIENT_SECRET
              value: {{ .Values.backend.env.IDENTITY_AUDIT_DEV_CLIENT_SECRET | quote }}
            - name: IDENTITY_AUDIT_DEV_DEFAULT_FILTERS
              value: {{ .Values.backend.env.IDENTITY_AUDIT_DEV_DEFAULT_FILTERS | quote }}
            - name: IDENTITY_AUDIT_NPE_TENANT_ID
              value: {{ .Values.backend.env.IDENTITY_AUDIT_NPE_TENANT_ID | quote }}
            - name: IDENTITY_AUDIT_NPE_CLIENT_ID
              value: {{ .Values.backend.env.IDENTITY_AUDIT_NPE_CLIENT_ID | quote }}
            - name: IDENTITY_AUDIT_NPE_CLIENT_SECRET
              value: {{ .Values.backend.env.IDENTITY_AUDIT_NPE_CLIENT_SECRET | quote }}
            - name: IDENTITY_AUDIT_NPE_DEFAULT_FILTERS
              value: {{ .Values.backend.env.IDENTITY_AUDIT_NPE_DEFAULT_FILTERS | quote }}
            - name: IDENTITY_AUDIT_PROD_TENANT_ID
              value: {{ .Values.backend.env.IDENTITY_AUDIT_PROD_TENANT_ID | quote }}
            - name: IDENTITY_AUDIT_PROD_CLIENT_ID
              value: {{ .Values.backend.env.IDENTITY_AUDIT_PROD_CLIENT_ID | quote }}
            - name: IDENTITY_AUDIT_PROD_CLIENT_SECRET
              value: {{ .Values.backend.env.IDENTITY_AUDIT_PROD_CLIENT_SECRET | quote }}
            - name: IDENTITY_AUDIT_PROD_DEFAULT_FILTERS
              value: {{ .Values.backend.env.IDENTITY_AUDIT_PROD_DEFAULT_FILTERS | quote }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          {{- if or .Values.secrets.azureKeyVault.enabled .Values.dataStorage.enabled .Values.payloadStorage.enabled }}
          volumeMounts:
            {{- if .Values.secrets.azureKeyVault.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
            {{- end }}
            {{- if .Values.dataStorage.enabled }}
            - name: data-storage
              mountPath: {{ .Values.dataStorage.mountPath | default "/app/data" }}
            {{- else if .Values.payloadStorage.enabled }}
            - name: payload-storage
              mountPath: {{ .Values.payloadStorage.mountPath | default "/app/data/payloads" }}
            {{- end }}
          {{- end }}

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]

      {{- if or .Values.secrets.azureKeyVault.enabled .Values.dataStorage.enabled .Values.payloadStorage.enabled }}
      volumes:
        {{- if .Values.secrets.azureKeyVault.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: pattern-secrets-provider
        {{- end }}
        {{- if .Values.dataStorage.enabled }}
        - name: data-storage
          persistentVolumeClaim:
            claimName: {{ include "pattern-assessment.backend.name" . }}-data-storage
        {{- else if .Values.payloadStorage.enabled }}
        - name: payload-storage
          persistentVolumeClaim:
            claimName: {{ include "pattern-assessment.backend.name" . }}-payload-storage
        {{- end }}
      {{- end }}

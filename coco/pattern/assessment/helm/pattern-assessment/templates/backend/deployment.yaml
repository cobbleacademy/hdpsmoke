apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pattern-assessment.backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "pattern-assessment.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pattern-assessment.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pattern-assessment.serviceAccountName" . }}

      # Spread pods across availability zones for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pattern-assessment.backend.selectorLabels" . | nindent 14 }}

      containers:
        - name: backend
          image: {{ include "pattern-assessment.backend.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: NODE_ENV
              value: production
            - name: OPENAI_MODEL
              value: {{ .Values.backend.env.OPENAI_MODEL | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.backend.env.FRONTEND_URL | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pattern-secrets
                  key: OPENAI_API_KEY

            # ── Provider API — tab mode ─────────────────────────────────────
            - name: PROVIDER_ENVS
              value: {{ .Values.backend.env.PROVIDER_ENVS | quote }}
            - name: PROVIDER_ENV_PAYLOAD_FILES
              value: {{ .Values.backend.env.PROVIDER_ENV_PAYLOAD_FILES | quote }}
            - name: PROVIDER_ADM_DEV_URLS
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_URLS | quote }}
            - name: PROVIDER_ADM_DEV_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_URL_LABELS | quote }}
            - name: PROVIDER_ADM_DEV_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_ADM_DEV_URL_AUTH_TYPES | quote }}
            - name: PROVIDER_DEV_URLS
              value: {{ .Values.backend.env.PROVIDER_DEV_URLS | quote }}
            - name: PROVIDER_DEV_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_DEV_URL_LABELS | quote }}
            - name: PROVIDER_DEV_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_DEV_URL_AUTH_TYPES | quote }}
            - name: PROVIDER_NPE_URLS
              value: {{ .Values.backend.env.PROVIDER_NPE_URLS | quote }}
            - name: PROVIDER_NPE_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_NPE_URL_LABELS | quote }}
            - name: PROVIDER_NPE_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_NPE_URL_AUTH_TYPES | quote }}
            - name: PROVIDER_PROD_URLS
              value: {{ .Values.backend.env.PROVIDER_PROD_URLS | quote }}
            - name: PROVIDER_PROD_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_PROD_URL_LABELS | quote }}
            - name: PROVIDER_PROD_URL_AUTH_TYPES
              value: {{ .Values.backend.env.PROVIDER_PROD_URL_AUTH_TYPES | quote }}
            # ── Legacy mode (backward compat when PROVIDER_ENVS not set) ───
            - name: PROVIDER_URLS
              value: {{ .Values.backend.env.PROVIDER_URLS | quote }}
            - name: PROVIDER_URL_LABELS
              value: {{ .Values.backend.env.PROVIDER_URL_LABELS | quote }}
            - name: PROVIDER_AUTH_TYPE
              value: {{ .Values.backend.env.PROVIDER_AUTH_TYPE | quote }}
            # ── Auth credentials (shared) ───────────────────────────────────
            - name: PROVIDER_TIMEOUT_MS
              value: {{ .Values.backend.env.PROVIDER_TIMEOUT_MS | quote }}
            - name: PROVIDER_API_KEY
              value: {{ .Values.backend.env.PROVIDER_API_KEY | quote }}
            - name: PROVIDER_ENTRA_TENANT_ID
              value: {{ .Values.backend.env.PROVIDER_ENTRA_TENANT_ID | quote }}
            - name: PROVIDER_ENTRA_CLIENT_ID
              value: {{ .Values.backend.env.PROVIDER_ENTRA_CLIENT_ID | quote }}
            - name: PROVIDER_ENTRA_CLIENT_SECRET
              value: {{ .Values.backend.env.PROVIDER_ENTRA_CLIENT_SECRET | quote }}
            - name: PROVIDER_ENTRA_SCOPE
              value: {{ .Values.backend.env.PROVIDER_ENTRA_SCOPE | quote }}
            - name: PROVIDER_X_APIKEY
              value: {{ .Values.backend.env.PROVIDER_X_APIKEY | quote }}
            - name: PROVIDER_X_APISECRET
              value: {{ .Values.backend.env.PROVIDER_X_APISECRET | quote }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Mount secrets from Key Vault CSI (no-op if provider is "kubernetes")
          {{- if .Values.secrets.azureKeyVault.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          {{- end }}

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]

      {{- if .Values.secrets.azureKeyVault.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: pattern-secrets-provider
      {{- end }}

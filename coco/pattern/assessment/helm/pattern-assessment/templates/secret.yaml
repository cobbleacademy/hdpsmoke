{{- if eq .Values.secrets.provider "kubernetes" }}
# Plain Kubernetes Secret — suitable for dev and staging.
# For production use secrets.provider: azure-keyvault instead.
apiVersion: v1
kind: Secret
metadata:
  name: pattern-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.kubernetes.openaiApiKey | quote }}
  {{- if .Values.secrets.kubernetes.databaseUrl }}
  # Group Permission Evaluation — expects an externally managed Postgres
  # (e.g. Azure Database for PostgreSQL Flexible Server), not an in-cluster
  # database. See docs/adr/0015-group-permission-evaluation.md.
  DATABASE_URL: {{ .Values.secrets.kubernetes.databaseUrl | quote }}
  {{- end }}
{{- end }}

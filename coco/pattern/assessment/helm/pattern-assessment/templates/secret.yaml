{{- if eq .Values.secrets.provider "kubernetes" }}
# Plain Kubernetes Secret — suitable for dev and staging.
# For production use secrets.provider: azure-keyvault instead.
apiVersion: v1
kind: Secret
metadata:
  name: pattern-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.kubernetes.openaiApiKey | quote }}
{{- end }}

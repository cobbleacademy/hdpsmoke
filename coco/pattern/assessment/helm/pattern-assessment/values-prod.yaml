# ── values-prod.yaml ──────────────────────────────────────────────────────────
# Merges on top of values.yaml for the production environment.
# Deploy: helm upgrade --install ... -f values.yaml -f values-prod.yaml

global:
  registry: myacr.azurecr.io
  imagePullPolicy: IfNotPresent

backend:
  tag: ""                              # set at deploy time: --set backend.tag=v1.2.3
  replicas: 2
  env:
    FRONTEND_URL: "https://app.yourdomain.com"
    OPENAI_MODEL: gpt-4o-mini

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

dataStorage:
  enabled: true
  storageClass: managed-csi            # Azure managed CSI for high performance
  size: 10Gi                            # larger size for production
  mountPath: /app/data

frontend:
  tag: ""                              # set at deploy time: --set frontend.tag=v1.2.3
  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: app.yourdomain.com
  tls:
    enabled: true
    secretName: pattern-prod-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

secrets:
  provider: azure-keyvault             # Key Vault CSI driver on production
  azureKeyVault:
    enabled: true
    keyvaultName: "my-keyvault"        # replace with your Key Vault name
    tenantId: ""                       # replace with your Azure tenant ID
    userAssignedIdentityID: ""         # replace with managed identity client ID
    secretName: openai-api-key

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: ""   # replace with managed identity client ID

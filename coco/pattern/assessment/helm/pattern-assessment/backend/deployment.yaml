apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pattern-assessment.backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "pattern-assessment.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pattern-assessment.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pattern-assessment.serviceAccountName" . }}

      # Spread pods across availability zones for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pattern-assessment.backend.selectorLabels" . | nindent 14 }}

      containers:
        - name: backend
          image: {{ include "pattern-assessment.backend.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: NODE_ENV
              value: production
            - name: OPENAI_MODEL
              value: {{ .Values.backend.env.OPENAI_MODEL | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.backend.env.FRONTEND_URL | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pattern-secrets
                  key: OPENAI_API_KEY

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Mount secrets from Key Vault CSI (no-op if provider is "kubernetes")
          {{- if .Values.secrets.azureKeyVault.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          {{- end }}

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]

      {{- if .Values.secrets.azureKeyVault.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: pattern-secrets-provider
      {{- end }}

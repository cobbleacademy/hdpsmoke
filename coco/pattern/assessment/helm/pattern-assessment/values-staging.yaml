# ── values-staging.yaml ───────────────────────────────────────────────────────
# Merges on top of values.yaml for the staging environment.
# Deploy: helm upgrade --install ... -f values.yaml -f values-staging.yaml

global:
  registry: myacr.azurecr.io
  imagePullPolicy: Always              # always pull on staging

backend:
  tag: staging
  replicas: 1
  env:
    FRONTEND_URL: "https://staging.yourdomain.com"
    OPENAI_MODEL: gpt-4o-mini
    # Provider API — set these to populate the URL dropdown in the Payload Library
    PROVIDER_URLS: ""            # e.g. "https://dev-z3-providerservices.com/api/dev1/runtime/resolution/v3"
    PROVIDER_URL_LABELS: ""      # e.g. "Dev Z3"
    PROVIDER_AUTH_TYPE: none     # default dropdown pre-selection: none | api-key | entraid-apigee

  autoscaling:
    enabled: false

frontend:
  tag: staging
  replicas: 1

ingress:
  enabled: true
  className: nginx
  host: staging.yourdomain.com
  tls:
    enabled: true
    secretName: pattern-staging-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # See values-prod.yaml for why this must be >= frontend nginx's 300s
    # ranger-generate timeout — without it, the nginx-ingress-controller's
    # own 60s default silently overrides nginx's more generous setting.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

dataStorage:
  enabled: true
  storageClass: managed-premium        # or your preferred StorageClass
  size: 5Gi
  mountPath: /app/data

secrets:
  provider: kubernetes                 # plain K8s secret on staging
  kubernetes:
    openaiApiKey: ""                   # injected by CI pipeline: --set secrets.kubernetes.openaiApiKey=$KEY

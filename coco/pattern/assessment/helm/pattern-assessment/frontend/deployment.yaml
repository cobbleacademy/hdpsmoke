apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pattern-assessment.frontend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pattern-assessment.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "pattern-assessment.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pattern-assessment.frontend.selectorLabels" . | nindent 8 }}
      annotations:
        # Force pod rollout when the nginx ConfigMap changes
        checksum/nginx-conf: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pattern-assessment.frontend.selectorLabels" . | nindent 14 }}

      containers:
        - name: frontend
          image: {{ include "pattern-assessment.frontend.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false      # nginx needs root to bind port 80
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "pattern-assessment.frontend.name" . }}-nginx-conf

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ollama Prompt</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { font-size: 1.4rem; }
    textarea {
      width: 100%;
      height: 100px;
      font-size: 1rem;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      margin-top: 8px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    #response {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      white-space: pre-wrap;
      min-height: 60px;
      background: #fafafa;
    }
    .muted { color: #888; }
  </style>
</head>
<body>
  <h1>Ollama Prompt — model: {{ model }}</h1>
  <textarea id="prompt" placeholder="Type your prompt here..."></textarea>
  <button id="send">Send</button>
  <div id="response" class="muted">Response will appear here.</div>

  <script>
    const sendBtn = document.getElementById("send");
    const promptEl = document.getElementById("prompt");
    const responseEl = document.getElementById("response");

    sendBtn.addEventListener("click", async () => {
      const prompt = promptEl.value.trim();
      if (!prompt) return;

      sendBtn.disabled = true;
      responseEl.textContent = "Thinking...";
      responseEl.classList.add("muted");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        responseEl.classList.remove("muted");
        responseEl.textContent = data.response || data.error || "No response";
      } catch (err) {
        responseEl.textContent = "Error: " + err.message;
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

# hsm-bulk-client -- see java/docs/BULK_OPERATIONS.md (Tier 3) and
# java/docs/TIER3_POC_BUILD.md. Talks only to SVC (hsm-bulk-service); never receives
# inbound requests, so this runs as a one-shot batch job, not a server.
#
# client.db.columns and client.file.file-types are lists of objects/strings, which
# don't map cleanly onto single env vars -- override them via a job-specific config
# file (e.g. --spring.config.additional-location=file:./my-job.yml) rather than env
# vars, same as hsm-core-service's own hsm.security.access-rules list.

spring:
  main:
    web-application-type: none
  jackson:
    property-naming-strategy: SNAKE_CASE

client:
  job:
    type: ${JOB_TYPE:DB}          # DB | FILE
    mode: ${JOB_MODE:ENCRYPT}     # ENCRYPT | DECRYPT

  svc:
    base-url: ${SVC_BASE_URL:http://localhost:3006}
    # Must match SVC's own API_V1_PREFIX (hsm.service.api-v1-prefix,
    # helm/hsm-bulk-service/values.yaml's config.apiV1Prefix) -- the two are
    # configured independently, not auto-synced, so if SVC's is ever changed
    # this needs to change to match or every call 404s.
    api-v1-prefix: ${SVC_API_V1_PREFIX:/api/sensec/hsm/v1}
    app-id: ${SVC_APP_ID:payments-svc}
    # STATIC (default): token below is sent as-is, unchanged -- fine for demo/mock-mode
    # tokens (MockJwtValidator's fixed strings never expire) but a real Azure AD JWT
    # here would expire mid-job on any run longer than its TTL (~1h). AZURE_AD:
    # acquires a fresh bearer token per call via Workload Identity instead (see
    # AzureAdTokenProvider) -- token/SVC_TOKEN below is then unused; azure-token-scope
    # must be set instead.
    auth-mode: ${SVC_AUTH_MODE:STATIC}
    token: ${SVC_TOKEN:}
    # Only used when auth-mode=AZURE_AD -- must match whatever SVC's own Azure AD app
    # registration exposes as its audience/scope (mirrors hsm.jwt.audience on SVC).
    azure-token-scope: ${SVC_AZURE_TOKEN_SCOPE:}
    dek-batch-max-items: ${SVC_DEK_BATCH_MAX_ITEMS:100}
    # PKCS#8 PEM. Never sent anywhere -- only used locally to unwrap what SVC
    # returns. The corresponding public key must already be registered on
    # app_registrations.public_key_pem for svc.app-id (see TIER3_POC_BUILD.md;
    # no admin endpoint provisions this yet -- it's a direct DB step).
    private-key-pem: ${CLIENT_PRIVATE_KEY_PEM:}

  db:
    source:
      jdbc-url: ${DB_SOURCE_JDBC_URL:}
      username: ${DB_SOURCE_USERNAME:}
      password: ${DB_SOURCE_PASSWORD:}
      schema: ${DB_SOURCE_SCHEMA:}
      table: ${DB_SOURCE_TABLE:}
    target:
      # Defaults to source.jdbc-url when blank -- same-DB, different-schema/table
      # is the common case; set explicitly only for a genuinely separate target DB.
      jdbc-url: ${DB_TARGET_JDBC_URL:}
      username: ${DB_TARGET_USERNAME:}
      password: ${DB_TARGET_PASSWORD:}
      schema: ${DB_TARGET_SCHEMA:}
      table: ${DB_TARGET_TABLE:}
    key-column: ${DB_KEY_COLUMN:id}
    row-batch-size: ${DB_ROW_BATCH_SIZE:100}
    # Example shape -- override in a job-specific config file:
    # columns:
    #   - source: ssn
    #     target: ssn_ciphertext_token
    #   - source: account_number
    #     target: account_number_ciphertext_token
    #   # target-type only matters for DECRYPT jobs (ignored on ENCRYPT, whose
    #   # target is always the ciphertext_token VARCHAR/TEXT column) -- what SQL
    #   # type to parse the decrypted plaintext into before insertion. Omit /
    #   # STRING (default) for a VARCHAR/TEXT target. Other values: DATE,
    #   # TIMESTAMP, NUMERIC (DECIMAL/NUMERIC-family columns), INTEGER
    #   # (INT/BIGINT/SMALLINT-family columns).
    #   - source: dob_ciphertext_token
    #     target: dob
    #     target-type: DATE
    #   # dek-name only matters on ENCRYPT jobs -- unset means today's default (one
    #   # DEK per row's value for this column); set means every row shares the
    #   # current DEK for this name instead (one /dek/issue lookup per column per
    #   # run, not one per row). Use the SAME dek-name on this column's ENCRYPT and
    #   # DECRYPT config -- it doesn't affect DECRYPT's own behavior (that always
    #   # resolves by the edek_id embedded in each row's token), but keeping them in
    #   # sync avoids confusion about which DEK protects which column.
    #   - source: account_number
    #     target: account_number_ciphertext_token
    #     dek-name: customers.account_number
    columns: []
    # Non-sensitive columns copied source-to-target as-is (same name both
    # sides, never encrypted/decrypted). Nothing beyond key-column + columns +
    # passthrough-columns is ever read from source or written to target --
    # any other target-table column not listed here gets its DEFAULT/NULL, or
    # the INSERT fails if that column is NOT NULL with no default.
    # Example: passthrough-columns: [name, email, created_at]
    passthrough-columns: []

  file:
    source:
      type: ${FILE_SOURCE_TYPE:LOCAL}   # LOCAL | ADLS
      root: ${FILE_SOURCE_ROOT:}        # local path, or abfss://<container>@<account>.dfs.core.windows.net/<path>
    target:
      type: ${FILE_TARGET_TYPE:LOCAL}   # independent of source.type -- e.g. source: ADLS, target: LOCAL is valid
      root: ${FILE_TARGET_ROOT:}
    # Example: file-types: [".png", ".txt", ".pdf"] -- empty list means all files.
    file-types: []
    chunk-size-bytes: ${FILE_CHUNK_SIZE_BYTES:8388608}   # 8 MiB default
    files-per-batch: ${FILE_FILES_PER_BATCH:10}

# Reverses db-encrypt-example.yml -- source/target swap roles: source now
# holds ciphertext values, target receives decrypted plaintext.
# columns.source/target also swap meaning accordingly.

client:
  job:
    type: DB
    mode: DECRYPT
  svc:
    base-url: http://localhost:3006
    app-id: payments-svc
    auth-mode: STATIC
    token: "<bearer token for app-id>"
    # azure-token-scope: "api://hsm-core-service/.default"   # only when auth-mode: AZURE_AD
    dek-batch-max-items: 100
    private-key-pem: |
      -----BEGIN PRIVATE KEY-----
      <your PKCS#8 private key here>
      -----END PRIVATE KEY-----
  db:
    # SQL Server/Azure SQL and Oracle also supported, see db-encrypt-example.yml
    # for jdbc-url syntax and the optional dialect override. See
    # db-decrypt-no-natural-key-example.yml if the source table here has no
    # real key column at all (e.g. its own ENCRYPT job used
    # skip-key-column-on-target) -- source.query can compute a ROW_NUMBER()
    # over any deterministic column(s), ciphertext columns included.
    source:
      jdbc-url: "jdbc:postgresql://host:5432/appdb"
      username: "<db user>"
      password: "<db password>"
      schema: "secure"
      table: customers_encrypted
    target:
      jdbc-url: "jdbc:postgresql://host:5432/appdb"
      username: "<db user>"
      password: "<db password>"
      schema: "raw"
      table: customers_decrypted
    key-column: id
    key-column-type: INTEGER   # only needed for checkpoint resume, see below
    row-batch-size: 100
    parallelism: 4   # see db-encrypt-example.yml for what this does
    # Use a different job-id than the ENCRYPT job's checkpoint (or a different
    # table-name) -- these are two distinct pipelines even against the same
    # source id column, and sharing one job-id would clobber shared progress.
    checkpoint:
      enabled: true
      resume: true
      job-id: customers-decrypt-2024
      table-name: hsm_bulk_checkpoint
      schema: "raw"   # see db-encrypt-example.yml for why this should be set explicitly
    columns:
      - source: ssn_ciphertext
        target: ssn
      # dek-name isn't needed here for correctness -- DECRYPT always resolves
      # by the edek_id embedded in each row's own token, never by name. But
      # DO set it to match the ENCRYPT job's column anyway: it's also what
      # gates DbBulkJob's persistent decrypt-side DEK cache (an unwrapped DEK
      # is cached for the whole job run only for columns marked dek-name here,
      # matching what the data actually is). Leaving it unset on a column
      # whose data really is dek-name-reused costs one full /dek/unwrap round
      # trip (and one RSA-OAEP unwrap) per sub-batch instead of once per job.
      - source: account_number_ciphertext
        target: account_number
        dek-name: customers.account_number   # matches db-encrypt-example.yml's column
      # target-type: the decrypted plaintext is always a String out of
      # DekManager.decrypt() -- this says what SQL type to parse it into
      # before insertion, since `dob` here is a real DATE column, not
      # VARCHAR. Other values: TIMESTAMP, NUMERIC, INTEGER; omit/STRING for
      # a VARCHAR/TEXT target (see ssn/account_number above).
      - source: dob_ciphertext
        target: dob
        target-type: DATE
    # Must mirror db-encrypt-example.yml's passthrough-columns -- same names,
    # copied back to the decrypted target table as-is.
    passthrough-columns:
      - name
      - created_at

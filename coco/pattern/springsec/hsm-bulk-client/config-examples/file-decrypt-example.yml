# Reverses file-encrypt-example.yml -- source now holds the encrypted files
# (length-prefixed framing + edek_id header), target receives decrypted output,
# mirroring the same relative paths/filenames.

client:
  job:
    type: FILE
    mode: DECRYPT
  svc:
    base-url: http://localhost:3006
    app-id: payments-svc
    token: "<bearer token for app-id>"
    dek-batch-max-items: 100
    private-key-pem: |
      -----BEGIN PRIVATE KEY-----
      <your PKCS#8 private key here>
      -----END PRIVATE KEY-----
  file:
    source:
      type: LOCAL
      root: /path/to/target
    target:
      type: LOCAL
      root: /path/to/roundtrip
    file-types: []
    chunk-size-bytes: 8388608
    files-per-batch: 10
    # dek-name isn't needed here for correctness -- DECRYPT always resolves by
    # the edek_id embedded in each file's own header, never by name. But DO
    # set it to match the ENCRYPT job's value anyway: it's also what gates
    # FileBulkJob's persistent decrypt-side DEK cache for the whole job run.
    # Leaving it unset on a job whose files really do share one DEK costs one
    # full /dek/unwrap round trip (and one RSA-OAEP unwrap) per batch instead
    # of once per job.
    dek-name: customer-files-2024   # matches file-encrypt-example.yml's value
    # compress-before-encrypt is likewise NOT set here on purpose -- it's an
    # encrypt-side-only, per-job knob (see file-encrypt-example.yml). Decrypt
    # never needs to know whether the encrypt job used it: every chunk carries
    # its own compressed/raw marker, self-describing regardless of this job's
    # own config.
    parallelism: 4
    checkpoint:
      enabled: true
      resume: true
      job-id: customer-files-decrypt-job   # distinct from the encrypt job's job-id
      flush-interval: 1000

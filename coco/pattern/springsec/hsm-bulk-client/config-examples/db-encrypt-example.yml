# Example BULK DB encrypt job config -- the exact shape verified end-to-end in
# java/docs/TIER3_POC_BUILD.md. Copy this, fill in the real values, run with:
#   scripts/run.sh config-examples/db-encrypt-example.yml
#
# Generating a keypair for svc.private-key-pem (the public half must be
# registered on app_registrations.public_key_pem for svc.app-id -- no admin
# endpoint does this yet, see TIER3_POC_BUILD.md):
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl rsa -in private.pem -pubout -out public.pem

client:
  job:
    type: DB
    mode: ENCRYPT
  svc:
    base-url: http://localhost:3005
    app-id: payments-svc
    # STATIC (default): token below sent as-is. AZURE_AD: fresh Workload Identity
    # token per call instead -- use this for any job that might run longer than a
    # token's TTL; see TIER3_POC_BUILD.md and set azure-token-scope, not token, below.
    auth-mode: STATIC
    token: "<bearer token for app-id>"
    # azure-token-scope: "api://hsm-core-service/.default"   # only when auth-mode: AZURE_AD
    dek-batch-max-items: 100
    private-key-pem: |
      -----BEGIN PRIVATE KEY-----
      <your PKCS#8 private key here>
      -----END PRIVATE KEY-----
  db:
    # Postgres, SQL Server (Azure SQL Database/Managed Instance too -- wire-
    # compatible, same driver/dialect), and Oracle are all supported, source
    # and target independently (a job can read from one vendor and write to
    # another). Dialect is auto-detected from the jdbc-url scheme below
    # (jdbc:postgresql:/jdbc:sqlserver:/jdbc:oracle:) -- only set dialect
    # explicitly if that detection would be wrong for your URL (e.g. a
    # product that presents a different vendor's wire protocol for driver
    # compatibility while diverging from that vendor's real SQL behavior --
    # see DbDialect's javadoc):
    #   source:
    #     jdbc-url: "jdbc:sqlserver://host:1433;databaseName=appdb;encrypt=true"
    #     jdbc-url: "jdbc:oracle:thin:@host:1521/ORCLPDB1"
    #     dialect: SQL_SERVER   # ORACLE | POSTGRESQL -- only if auto-detect is wrong
    # If your source table has no existing non-sensitive, stable, sortable column
    # to use as key-column (nothing but sensitive columns like ssn) -- and you
    # can't create a view or alter the target schema to work around it -- see
    # db-encrypt-no-natural-key-example.yml instead: TableRef.query computes a
    # ROW_NUMBER()-based key inline (no CREATE VIEW needed), and
    # skip-key-column-on-target keeps that synthetic key out of the target
    # table entirely.
    source:
      jdbc-url: "jdbc:postgresql://host:5432/appdb"
      username: "<db user>"
      password: "<db password>"
      schema: "raw"
      table: customers
    target:
      # Omit jdbc-url/username/password entirely to reuse source's connection
      # (same DB, different schema/table -- the common case).
      jdbc-url: "jdbc:postgresql://host:5432/appdb"
      username: "<db user>"
      password: "<db password>"
      schema: "secure"
      table: customers_encrypted
    key-column: id
    # Only needed for checkpoint resume -- parses the persisted last_key text back
    # into the right Java type for the WHERE id > ? resume parameter. Leave unset
    # (defaults to STRING) if checkpoint is disabled or resume is never used.
    key-column-type: INTEGER
    row-batch-size: 100
    # 1 (default) = today's exact sequential behavior. >1 partitions the key range
    # into that many pieces up front and runs one independent worker per partition
    # concurrently -- each worker does the same fetch-issue-encrypt-insert pipeline
    # scoped to its own key range. Also raises the JDBC connection pool size to
    # cover every concurrent worker. Combine with checkpoint below for safe
    # crash-resume of a parallel run too -- each partition gets its own
    # job-id-p0/p1/... checkpoint automatically.
    parallelism: 4
    # Persists progress so a crashed/killed run can resume instead of restarting
    # from row 1. Omit this whole block for the pre-existing, zero-overhead
    # behavior. Requires a real, unique key-column -- see the design notes in
    # ClientProperties.Db.Checkpoint's javadoc for exactly why and how this stays
    # safe (batch + checkpoint commit in one transaction) without needing an
    # upsert on the actual target table.
    checkpoint:
      enabled: true
      resume: true          # false = override: clear prior progress, start from row 1
      job-id: customers-encrypt-2024   # must be unique per distinct job pipeline
      table-name: hsm_bulk_checkpoint  # auto-created if missing; default shown
      # Unqualified (unset) means CREATE TABLE resolves against whatever schema
      # is first in your DB role's default search_path -- not guaranteed to be
      # one that role can create in. Set explicitly (typically matching
      # target.schema above) rather than relying on the connection default.
      schema: "secure"
    columns:
      - source: ssn
        target: ssn_ciphertext
      # dek-name: every row's account_number shares the current DEK for
      # "customers.account_number" instead of each getting its own -- one
      # /dek/issue lookup for this column for the whole run, not one per row.
      - source: account_number
        target: account_number_ciphertext
        dek-name: customers.account_number
      # target-type only matters for DECRYPT jobs -- ignored here, target is
      # always a ciphertext VARCHAR/TEXT column on ENCRYPT.
      - source: dob
        target: dob_ciphertext
    # Non-sensitive columns copied to the target table as-is, same name both
    # sides. Anything not listed in columns or passthrough-columns is left
    # out of the INSERT entirely -- it gets the target column's DEFAULT/NULL,
    # or the whole batch fails if that column is NOT NULL with no default.
    passthrough-columns:
      - name
      - created_at

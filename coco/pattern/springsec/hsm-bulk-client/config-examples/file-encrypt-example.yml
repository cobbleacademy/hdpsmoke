# Example BULK File encrypt job config -- the exact shape verified end-to-end
# (nested directory tree, mixed file sizes, multi-chunk framing) in
# java/docs/TIER3_POC_BUILD.md. Run with:
#   scripts/run.sh config-examples/file-encrypt-example.yml
#
# source.type/target.type are independent -- LOCAL or ADLS on either side, in
# any combination. For ADLS, set root to
# abfss://<container>@<account>.dfs.core.windows.net/<path> and ensure this
# process's Azure credentials (AZURE_CLIENT_ID/AZURE_TENANT_ID env vars, or a
# federated token file) can reach that storage account.

client:
  job:
    type: FILE
    mode: ENCRYPT
  svc:
    base-url: http://localhost:3005
    app-id: payments-svc
    # auth-mode defaults to STATIC when unset (token below sent as-is). AZURE_AD,
    # SELF_SIGNED_JWT, MTLS also supported -- see AUTHORIZATION.md and
    # db-encrypt-example.yml (java/hsm-bulk-client/config-examples/) for the full
    # commented-out example of each.
    token: "<bearer token for app-id>"
    # azure-token-scope: "api://hsm-core-service/.default"   # only when auth-mode: AZURE_AD
    # signing-private-key-pem: |                              # only when auth-mode: SELF_SIGNED_JWT
    #   -----BEGIN PRIVATE KEY-----
    #   <PKCS#8 signing private key -- public half registered via POST /admin/apps/keys>
    #   -----END PRIVATE KEY-----
    # mtls-cert-pem: |                                         # only when auth-mode: MTLS
    #   -----BEGIN CERTIFICATE-----
    #   <PEM cert -- fingerprint registered via POST /admin/apps/mtls-cert, not the cert itself>
    #   -----END CERTIFICATE-----
    # mtls-key-pem: |                                          # only when auth-mode: MTLS
    #   -----BEGIN PRIVATE KEY-----
    #   <PKCS#8 private key matching mtls-cert-pem>
    #   -----END PRIVATE KEY-----
    dek-batch-max-items: 100
    private-key-pem: |
      -----BEGIN PRIVATE KEY-----
      <your PKCS#8 private key here>
      -----END PRIVATE KEY-----
  file:
    source:
      type: LOCAL
      root: /path/to/source
    target:
      type: LOCAL
      root: /path/to/target
    file-types: []   # e.g. [".png", ".txt", ".pdf"] -- empty means all files
    chunk-size-bytes: 8388608   # 8 MiB
    files-per-batch: 10
    # false (default) -- unchanged behavior. true -- gzip each chunk before the
    # mandatory base64 plaintext-safety encoding (see FileBulkJob's class javadoc).
    # Worth it when storage/bandwidth is a real constraint on a large run and your
    # files are text-like/compressible (documents, logs, exports) -- costs little
    # for already-compressed content (images, video, zips) but never hurts either;
    # real CPU cost either way. Per-job only, applies to every chunk of every file.
    # Decrypt needs no matching setting on the decrypting job's own config -- every
    # chunk is self-describing regardless of what produced it.
    # compress-before-encrypt: true
    # Unset (default) -- every file mints its own DEK, unchanged pre-existing
    # behavior. Set -- one persistent DEK for this job's business purpose (e.g.
    # "all customer files"), reused across every future run using the same name,
    # not just within one run. Needs hsm-core-service's named-DEK rotation to
    # bound how much data one long-lived name ends up protecting -- see
    # NAMED_DEK_ROTATION_* on that service.
    dek-name: customer-files-2024
    # 1 (default) -- sequential, unchanged. >1 partitions the file list into that
    # many groups and runs one worker per group concurrently.
    parallelism: 4
    # Persists progress via a single batched manifest file in the target store,
    # so a crashed/killed run can resume instead of reprocessing everything.
    # Omit this whole block for the pre-existing, zero-overhead behavior.
    checkpoint:
      enabled: true
      resume: true             # false = override: clear prior progress, start from file 1
      job-id: customer-files-job   # must be unique per distinct job pipeline
      # How many file completions between manifest rewrites -- deliberately
      # separate from files-per-batch (an HTTP-batching-size knob, unrelated).
      # Each flush rewrites the whole manifest, so too-small a value multiplies
      # that cost badly at scale; 1000 (default, shown here) keeps it bounded
      # regardless of files-per-batch or total file count.
      flush-interval: 1000

# hsm-bulk-service (Tier 3 PoC) -- see java/docs/BULK_OPERATIONS.md.
#
# Shares the SAME env var names as hsm-core-service's application.yml for
# DATABASE_URL / JWT_* / AZURE_* / API_V1_PREFIX, so both services point at the
# same Postgres schema and the same JWT issuer/JWKS in a real deployment.
#
# Local/PoC default: points at the SAME H2 file hsm-core-service's demo mode
# uses (./demo_hsm_h2), with AUTO_SERVER=TRUE added -- H2 file-mode is normally
# single-JVM-exclusive; AUTO_SERVER=TRUE lets both services' JVMs open it
# concurrently, which BulkVsBatchBenchmark's token-format-compatibility check
# (a /dek/issue-derived record read back through hsm-core-service's real
# /decrypt) depends on. H2 does not support combining AUTO_SERVER=TRUE with
# DB_CLOSE_ON_EXIT=FALSE (throws "Feature not supported"), so this omits that
# flag -- run hsm-core-service itself with
# DEMO_DATABASE_URL=jdbc:h2:file:./demo_hsm_h2;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
# (matching this default, also without DB_CLOSE_ON_EXIT=FALSE) for the two to
# actually share the file.

server:
  port: ${SERVER_PORT:3006}

spring:
  application:
    name: hsm-bulk-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./demo_hsm_h2;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

hsm:
  # true (default here, unlike hsm-core-service's production-shaped default)
  # swaps both KekClient and JwtValidator to their Mock implementations -- see
  # com.hsm.bulk.config.CryptoBeansConfig -- so BulkVsBatchBenchmark runs with
  # zero external dependencies, same "zero setup" intent as, and now the exact
  # same flag name and semantics as, hsm-core-service's own DEMO_MODE.
  demo-mode: ${DEMO_MODE:true}
  # Independent of demo-mode -- only swaps the KekClient, leaves whichever
  # JwtValidator demo-mode selected untouched. Same relationship as
  # hsm-core-service's demo-mode/skip-akv pair: set DEMO_MODE=false + this to
  # true for real JWT/scope validation against real app_registrations rows
  # without needing a reachable Key Vault/Managed HSM yet.
  skip-akv: ${SKIP_AKV:false}
  azure:
    client-id: ${AZURE_CLIENT_ID:}
    tenant-id: ${AZURE_TENANT_ID:}
    keyvault-url: ${AZURE_KEYVAULT_URL:}
    kek-name: ${AZURE_KEK_NAME:hsm-master-kek}
    kek-version: ${AZURE_KEK_VERSION:}
    keyvault-secret-url: ${AZURE_KEYVAULT_SECRET_URL:}
  jwt:
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    jwks-url: ${JWT_JWKS_URL:}
    audience: ${JWT_AUDIENCE:hsm-core-service}
    issuer: ${JWT_ISSUER:}
  service:
    api-v1-prefix: ${API_V1_PREFIX:/api/sensec/hsm/v1}
    dek-batch-max-items: ${DEK_BATCH_MAX_ITEMS:100}
  security:
    access-rules:
      - pattern: /dek/issue
        methods: [POST]
        authorities: [dek_issue]
      - pattern: /dek/unwrap
        methods: [POST]
        authorities: [dek_unwrap]

spring:
  sql:
    init:
      mode: always

hsm:
  demo-mode: true
  service:
    api-v1-prefix: /api/sensec/hsm/v1
    dek-batch-max-items: 100
  security:
    access-rules:
      - pattern: /dek/issue
        methods: [POST]
        authorities: [dek_issue]
      - pattern: /dek/unwrap
        methods: [POST]
        authorities: [dek_unwrap]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsm-databricks-udf"
version = "0.1.0"
description = "hsm_encrypt/hsm_decrypt as Unity Catalog Python Functions -- see java/docs/DATABRICKS_UDF_DESIGN.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "requests>=2.31",
    "certifi",            # imported directly by svc_client (CA bundle support); already a requests dependency
    "pyyaml>=6.0",        # deid: reads de-identification profiles (safe loading only)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hsm_databricks_udf.deid" = ["restricted-zip3.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

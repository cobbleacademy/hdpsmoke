[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsm-databricks-udf"
version = "0.1.0"
description = "hsm_encrypt/hsm_decrypt as Unity Catalog Python Functions -- see java/docs/DATABRICKS_UDF_DESIGN.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "requests>=2.31",
    "certifi",            # imported directly by svc_client (CA bundle support); already a requests dependency
    "pyyaml>=6.0",        # deid: reads de-identification profiles (safe loading only)
]

[project.optional-dependencies]
# The Databricks DEID job (java/docs/DEIDENTIFICATION.md section 17). Databricks
# runtimes already have pyspark, pandas and pyarrow; the job's environment adds psycopg.
deid = [
    "pyspark>=3.5",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
hsm-deid = "hsm_databricks_udf.deid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hsm_databricks_udf.deid" = ["restricted-zip3.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hsm.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsm.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Deliberately no Role/RoleBinding/ClusterRoleBinding is created anywhere
# in this chart for this ServiceAccount. It exists solely as a Workload
# Identity federation anchor for Azure AD — the pod has zero Kubernetes
# API permissions. If a future change needs the pod to read its own
# ConfigMap/Secret via the API (it doesn't today — both are mounted as
# env vars by Kubernetes itself), add a narrowly-scoped Role then, not a
# blanket one now.
automountServiceAccountToken: true
{{- end }}

{{- if .Values.secrets.create }}
# Only rendered when secrets.create=true -- see the warning in values.yaml.
# Prefer the Azure Key Vault CSI driver or External Secrets Operator for
# real deployments; this exists for quick/dev environments only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hsm.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsm.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.values.databaseUrl | quote }}
  # Unlike hsm-core-service (which embeds credentials directly in DATABASE_URL),
  # this service's application.yml reads separate DATABASE_USERNAME/
  # DATABASE_PASSWORD env vars (defaulting to sa/blank for local H2 dev) --
  # set these explicitly for a real Postgres deployment.
  DATABASE_USERNAME: {{ .Values.secrets.values.databaseUsername | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.values.databasePassword | quote }}
  JWT_PUBLIC_KEY_PEM: {{ .Values.secrets.values.jwtPublicKeyPem | quote }}
  AZURE_CLIENT_SECRET: {{ .Values.secrets.values.azureClientSecret | quote }}
{{- end }}

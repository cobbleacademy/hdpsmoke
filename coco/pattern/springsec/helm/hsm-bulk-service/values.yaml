
# ── Image ──────────────────────────────────────────────────────────────────────
# Built from java/docker/Dockerfile.hsm-bulk-service.
image:
  repository: your-registry.azurecr.io/hsm-bulk-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Lower default than hsm-core-service's replicaCount: 2 -- this is a scoped,
# onboarding/de-boarding-window service (java/docs/BULK_OPERATIONS.md), not
# always-on shared traffic. Bump if driving multiple concurrent hsm-bulk-client
# jobs against it.
replicaCount: 1

# ── Service account & identity ──────────────────────────────────────────────────
# Same Workload Identity pattern as hsm-core-service (see that chart's values.yaml
# for the full explanation) -- this service also calls Azure Key Vault Managed HSM
# directly (its own AzureKeyVaultKekClient), with its own scoped identity, separate
# from hsm-core-service's.
serviceAccount:
  create: true
  name: ""   # defaults to the chart's fullname if empty
  annotations:
    azure.workload.identity/client-id: "<AZURE_CLIENT_ID>"
  labels: {}

workloadIdentity:
  enabled: true

istio:
  rewriteAppHTTPProbers: true

# ── Service ────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 3006

# ── Probes & health ────────────────────────────────────────────────────────────
# Defaults to tcp, not http: unlike hsm-core-service, this service has no
# GET /admin/health-equivalent endpoint yet -- only POST /dek/issue and
# POST /dek/unwrap, both authenticated. A tcp probe still catches a dead/hung
# process without needing an unauthenticated endpoint added just for this.
# Switch to http once a real health endpoint exists.
probes:
  type: tcp
  path: /api/sensec/hsm/v1/admin/health   # unused while type: tcp; kept for a future http switch
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  readinessInitialDelaySeconds: 15
  readinessPeriodSeconds: 10

# ── Resources ──────────────────────────────────────────────────────────────────
# Lighter than hsm-core-service's: this service never runs AES-GCM on plaintext,
# only RSA/HSM key-wrap operations -- smaller working set. Re-tune against real
# load before trusting these.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ── Autoscaling ────────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# ── Pod Disruption Budget ──────────────────────────────────────────────────────
# Off by default: with replicaCount: 1, a minAvailable: 1 PDB would block ALL
# voluntary node drains/evictions (nothing else to take over) -- an anti-pattern
# for a single-replica deployment. Enable only after bumping replicaCount above 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ── Security ───────────────────────────────────────────────────────────────────
# Mirrors the Dockerfile exactly -- see hsm-core-service's values.yaml for the
# full explanation of the distroless :nonroot uid/gid 65532 convention.
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# Writable scratch space for the JVM's own /tmp needs (readOnlyRootFilesystem
# makes everywhere else unwritable). This service has no demo-mode H2 file of
# its own (schema consumer, not owner -- see TIER3_POC_BUILD.md), so this can
# stay small.
tmpVolume:
  enabled: true
  sizeLimit: 64Mi

# ── Network policy ─────────────────────────────────────────────────────────────
# Off by default so the chart installs cleanly without assuming your CNI
# supports NetworkPolicy. This service should only ever need to reach Key
# Vault, Postgres, and DNS -- plus inbound only from whatever runs
# hsm-bulk-client.
networkPolicy:
  enabled: false
  ingressFromNamespaces: []   # e.g. namespaces that run hsm-bulk-client jobs
  egressCIDRs: []             # e.g. Postgres / Key Vault endpoints

# ── Application configuration ──────────────────────────────────────────────────
# Non-secret settings -> ConfigMap. Secret settings -> Kubernetes Secret (see
# `secrets` below) -- never put a credential-shaped value here.
config:
  # true = MockKekClient + MockJwtValidator (no real Key Vault/JWKS call) --
  # see com.hsm.bulk.config.CryptoBeansConfig. Production-shaped default here
  # is "false", unlike hsm-bulk-service's own application.yml default (which
  # defaults true for zero-setup local runs) -- this chart's default matches
  # what a real deployment should actually run with. Same flag name as
  # hsm-core-service's own config.demoMode.
  demoMode: "false"
  # Independent of demoMode -- only swaps the KekClient (see
  # com.hsm.bulk.config.CryptoBeansConfig). Same relationship as
  # hsm-core-service's demoMode/skipAkv pair.
  skipAkv: "false"
  serviceEnv: "production"
  logLevel: "INFO"
  apiV1Prefix: "/api/sensec/hsm/v1"
  # Item-count cap per /dek/issue or /dek/unwrap call -- hsm-bulk-client mirrors
  # this same value client-side so it never sends an oversized batch.
  dekBatchMaxItems: "100"
  # Hikari max connections to DATABASE_URL. Spring Boot's unconfigured default
  # is 10 -- fine for hsm-core-service's normal per-request traffic, but a bulk
  # DB job whose columns aren't using dek-name reuse issues/persists one
  # EdekRecord per row, sequentially per request; several concurrent
  # client.db.parallelism workers hitting unnamed columns can queue behind a
  # too-small pool here instead of actually running concurrently. Named-DEK
  # columns barely touch this (one issue/unwrap per column per job), so this
  # mainly matters for genuinely per-row DEK traffic at volume.
  dbPoolMaxSize: "20"

  # Rotates named DEKs issued via /dek/issue (DbBulkJob's per-column dek-name,
  # FileBulkJob's per-job dek-name) once they've been current longer than
  # maxAgeHours -- see com.hsm.bulk.scheduler.NamedDekRotationScheduler. Same
  # cron/enabled/maxAgeHours shape and defaults as hsm-core-service's own
  # namedDekRotation config.
  namedDekRotationCron: "0 3 * * *"
  namedDekRotationEnabled: "true"
  namedDekRotationMaxAgeHours: "720"

  azureClientId: ""    # managed identity client ID; auto-read from token JWT if empty
  azureTenantId: ""    # Azure AD tenant ID; read from AZURE_TENANT_ID env var if empty
  azureKeyVaultUrl: "https://<your-vault>.managedhsm.azure.net/"
  azureKekName: "hsm-master-kek"
  azureKekVersion: ""
  # Azure Key Vault -- Secrets (regular vault, not Managed HSM). Managed HSM
  # does not support the Secrets API; unused by this service today (no
  # secrets fetched), kept for parity with AzureKeyVaultKekClient's shared
  # constructor shape (com.hsm.bulk.crypto.AzureKeyVaultKekClient).
  azureKeyVaultSecretUrl: ""

  # Same JWT issuer/JWKS as hsm-core-service -- both services authenticate the
  # exact same per-app JWTs.
  jwtAudience: "hsm-core-service"
  jwtIssuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  jwtJwksUrl: ""

# ── Secrets ────────────────────────────────────────────────────────────────────
# DATABASE_URL (and, if used, JWT_PUBLIC_KEY_PEM) are credential-shaped and must
# never sit in a ConfigMap or in values.yaml committed to source control. See
# hsm-core-service's values.yaml for the full secrets.create tradeoff explanation
# -- same guidance applies here.
secrets:
  create: false
  existingSecretName: "hsm-bulk-service-secrets"
  values:
    # Same schema hsm-core-service owns/migrates (edek_records, app_registrations)
    # -- this service is a schema consumer, not owner (no Flyway here at all).
    databaseUrl: ""
    # Unlike hsm-core-service (credentials embedded in databaseUrl), this
    # service's application.yml reads separate DATABASE_USERNAME/PASSWORD.
    databaseUsername: ""
    databasePassword: ""
    jwtPublicKeyPem: ""

# ── Corporate proxy CA ────────────────────────────────────────────────────────
# Same mechanism and rationale as hsm-core-service's chart -- this service also
# depends on azure-identity and can hit the same corporate-proxy JWKS/Key Vault
# TLS-interception issue. See hsm-core-service/values.yaml's corporateCa block
# for the full explanation.
corporateCa:
  enabled: false
  configMapName: "corporate-ca"
  utilityImage: "eclipse-temurin:21-jre-alpine"
  trustStorePassword: "changeit"

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

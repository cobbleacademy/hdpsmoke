
# ── Image ──────────────────────────────────────────────────────────────────────
# NOT a separate codebase or image -- this chart deploys the exact same
# hsm-core-service artifact as helm/hsm-core-service's own chart, as a second,
# independently-scaled Deployment/release. The original motivation for a
# separate hsm-bulk-service process (noisy-neighbor / traffic-fairness
# isolation for bulk DEK-issuance calls, POST /dek/issue and POST /dek/unwrap,
# away from ordinary /encrypt /decrypt traffic -- see java/docs/BULK_OPERATIONS.md)
# is satisfied at the deployment level: route bulk traffic to THIS release's
# Service (e.g. via an Istio VirtualService path match on /dek/issue,
# /dek/unwrap) and everything else to the primary hsm-core-service release.
# Point this at the identical image the primary release uses.
image:
  repository: your-registry.azurecr.io/hsm-core-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

# ── Service account & identity — the actual "no static secrets" mechanism ──────
#
# This app authenticates to Azure Key Vault via DefaultAzureCredential — it
# never holds a client secret. In AKS, that credential resolves through
# Azure AD Workload Identity, which is a federation between THIS Kubernetes
# ServiceAccount and an Azure AD application/managed identity. The service
# account token is what gets exchanged for an Azure AD token — nothing else.
#
# This SA is granted ZERO Kubernetes RBAC permissions (no Role/RoleBinding
# is created by this chart) — it exists purely as a federation anchor, not
# as a way for the pod to talk to the Kubernetes API. Least privilege means
# the pod can mint a Key Vault token and nothing else inside the cluster.
#
# Can share the same Azure AD application/managed identity as the primary
# hsm-core-service release (both need identical Key Vault permissions), or a
# distinct one if you want independent audit trails per release -- either
# works, this chart doesn't assume which.
serviceAccount:
  create: true
  name: ""   # defaults to the chart's fullname if empty
  annotations:
    azure.workload.identity/client-id: "<AZURE_CLIENT_ID>"
  labels: {}

# Pod-level label required by the Workload Identity mutating webhook to
# inject the federated token volume. Do not remove.
workloadIdentity:
  enabled: true

# ── Istio ──────────────────────────────────────────────────────────────────────
# See helm/hsm-core-service/values.yaml's istio block for the full explanation
# of why this matters under STRICT mTLS and the one known unresolved issue.
istio:
  rewriteAppHTTPProbers: true

# ── Service ────────────────────────────────────────────────────────────────────
# Same port as the primary hsm-core-service release -- this is the identical
# image with the identical baked-in default (hsm.service default SERVER_PORT),
# not hsm-bulk-service's old 3006. Each release gets its own ClusterIP, so
# both Services can front port 3005 with no collision.
service:
  type: ClusterIP
  port: 3005

# ── Probes & health ────────────────────────────────────────────────────────────
# Real http health check now available (GET /admin/health, same endpoint the
# primary release uses) -- unlike the old hsm-bulk-service, which had no
# health endpoint of its own and defaulted to a bare tcp probe.
probes:
  type: http
  path: /api/sensec/hsm/v1/admin/health
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  readinessInitialDelaySeconds: 15
  readinessPeriodSeconds: 10

# ── Resources ──────────────────────────────────────────────────────────────────
# Same defaults as the primary hsm-core-service release -- it's the identical
# workload. Re-tune down (or up) once real traffic-split numbers between the
# two releases exist; nothing here assumes a particular split.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ── Autoscaling ────────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ── Pod Disruption Budget ──────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Security ───────────────────────────────────────────────────────────────────
# Mirrors the Dockerfile exactly -- see helm/hsm-core-service/values.yaml for
# the full explanation of the distroless :nonroot uid/gid 65532 convention.
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

tmpVolume:
  enabled: true
  sizeLimit: 128Mi

# ── Network policy ─────────────────────────────────────────────────────────────
# Off by default so the chart installs cleanly without assuming your CNI
# supports NetworkPolicy. This release should only ever need to reach Key
# Vault, Postgres, Splunk HEC, and DNS -- plus inbound from wherever routes
# bulk (/dek/issue, /dek/unwrap) traffic to it (e.g. an Istio ingress gateway
# or hsm-bulk-client jobs directly).
networkPolicy:
  enabled: false
  ingressFromNamespaces: []   # e.g. namespaces that run hsm-bulk-client jobs
  egressCIDRs: []             # e.g. Postgres / Key Vault / Splunk endpoints

# ── Application configuration ──────────────────────────────────────────────────
# Full config surface, identical to the primary hsm-core-service release's own
# values.yaml -- same image, same complete set of env vars (this release also
# serves /encrypt, /decrypt, and /admin/* if anything routes traffic there;
# nothing in the binary itself restricts it to bulk endpoints only, the
# isolation is enforced at the routing layer, not in config).
config:
  demoMode: "false"
  skipAkv: "false"
  dbSslEnabled: "false"
  dbSslCaCert: ""
  # Fourth, optional authentication mechanism (see AUTHORIZATION.md) -- same
  # image as hsm-core-service's own chart, same caveat: also requires
  # server.ssl.* (a mounted keystore Secret, not wired here) and a probe
  # scheme change to HTTPS once enabled. Leave false unless doing that too.
  mtlsEnabled: "false"
  dbSchema: ""
  cryptoSchema: "hsm_crypto"
  accessSchema: "hsm_access"
  serviceEnv: "production"
  logLevel: "INFO"
  apiV1Prefix: "/api/sensec/hsm/v1"
  batchExecutorPoolSize: "1"
  # Item-count cap per /dek/issue or /dek/unwrap call -- hsm-bulk-client
  # mirrors this same value client-side so it never sends an oversized batch.
  dekBatchMaxItems: "100"
  # Hikari max connections to DATABASE_URL. Spring Boot's unconfigured default
  # is 10 -- fine for ordinary per-request traffic, but a bulk DB job whose
  # columns aren't using dek-name reuse issues/persists one EdekRecord per
  # row, sequentially per request; several concurrent client.db.parallelism
  # workers hitting unnamed columns can otherwise queue behind a too-small
  # pool. Named-DEK columns barely touch this (one issue/unwrap per column
  # per job), so this mainly matters for genuinely per-row DEK traffic at
  # volume -- exactly what this release exists to absorb.
  dbPoolMaxSize: "20"
  demoDatabaseUrl: "jdbc:h2:file:/tmp/demo_hsm_h2;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE"

  # Rotates named DEKs (edek_records rows with a non-null current_dek_name,
  # including ones minted via /dek/issue) once they've been current longer
  # than maxAgeHours. Only needs to run on ONE release when both point at the
  # same database -- consider disabling here if the primary hsm-core-service
  # release already has this enabled, to avoid both releases sweeping the
  # same rows redundantly.
  namedDekRotationCron: "0 3 * * *"
  namedDekRotationEnabled: "true"
  namedDekRotationMaxAgeHours: "720"

  azureClientId: ""
  azureTenantId: ""
  azureKeyVaultUrl: "https://<your-vault>.managedhsm.azure.net/"
  azureKekName: "hsm-master-kek"
  azureKekVersion: ""
  azureKeyVaultSecretUrl: ""

  jwtAudience: "hsm-core-service"
  jwtIssuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  jwtJwksUrl: ""

  splunkEnabled: "false"
  splunkHecUrl: ""
  splunkIndex: "hsm_audit"
  # Distinct default from the primary release's "hsm-core-service" so Splunk
  # queries can tell which Deployment emitted a given audit event, even
  # though both run the identical binary.
  splunkSource: "hsm-bulk-service"
  splunkSourcetype: "_json"
  splunkVerifySsl: "true"
  splunkBatchSize: "50"
  splunkFlushIntervalSeconds: "5"

  kekRotationCron: "0 2 1 * *"
  # Only needs to run on ONE release -- rotateKek sweeps every KEK with
  # current EDEKs regardless of which release minted them (shared DB), so
  # running it on both is redundant work, not a correctness issue. Consider
  # disabling here if the primary release already handles it.
  kekRotationEnabled: "true"

  pbacEnabled: "false"
  plainidUrl: ""
  plainidApiKeySecretName: "plainid-api-key"
  pbacCacheTtlSeconds: "30"
  pbacFailOpen: "false"
  pbacHttpTimeoutSeconds: "3.0"
  pbacIntegrationConfigPath: "/app/config/pbac_integration.json"

  dekCacheEnabled: "false"
  dekCacheTtlSeconds: "60"
  cekCurrentKeySecretName: "cek-current-key"
  cekAlphaSecretName: "cek-alpha"
  cekBetaSecretName: "cek-beta"
  dekCacheReloadIntervalSeconds: "30"
  dekCacheExcludedClassifications: ""

# ── Secrets ────────────────────────────────────────────────────────────────────
# Same DB/Key Vault backing as the primary hsm-core-service release -- these
# values are typically identical to that release's own secret (both point at
# the same Postgres and the same Key Vault), just materialized under this
# release's own Secret name. See helm/hsm-core-service/values.yaml for the
# full secrets.create tradeoff explanation.
secrets:
  create: false
  existingSecretName: "hsm-bulk-service-secrets"
  values:
    databaseUrl: ""
    databaseUsername: ""
    databasePassword: ""
    jwtPublicKeyPem: ""
    azureClientSecret: ""
    splunkHecToken: ""
    redisUrl: ""

# ── PlainID integration wire-format config ────────────────────────────────────
pbacIntegration:
  enabled: false
  endpointPath: "/v2/isPermitted"
  auth:
    headerName: "Authorization"
    headerValueTemplate: "Bearer {api_key}"
  request:
    principalField: "principal"
    actionField:    "action"
    resourceField:  "resource"
    contextField:   "context"
  response:
    permittedPath: "permitted"
  resourceTemplates:
    encrypt: "hsm:encrypt:{data_classification}"
    decrypt: "hsm:decrypt:{data_classification}"

# ── Corporate proxy CA ────────────────────────────────────────────────────────
# Same mechanism as the primary hsm-core-service release -- see that chart's
# values.yaml corporateCa block for the full explanation.
corporateCa:
  enabled: false
  configMapName: "corporate-ca"
  utilityImage: "eclipse-temurin:21-jre-alpine"
  trustStorePassword: "changeit"

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

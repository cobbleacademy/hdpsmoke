{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cek-rotation.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cek-rotation.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# This SA is a Workload Identity federation anchor for the Rotation SPN only.
# It deliberately carries zero Kubernetes RBAC permissions — the pod can
# exchange its projected service-account token for an Azure AD token scoped
# to the target Key Vault, and nothing else inside the cluster.
automountServiceAccountToken: true
{{- end }}

{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hsmfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsmfs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hsmfs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # File API: the BFF only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ default .Release.Namespace $np.bffNamespace }}
          {{- with $np.bffPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if $np.monitoringNamespaces }}
    # Probes/metrics: monitoring only (kubelet probes are rewritten by Istio to 15020).
    - from:
        {{- range $np.monitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.managementPort }}
    {{- end }}
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $np.coreServiceNamespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.coreServiceNamespace }}
      ports:
        - protocol: TCP
          port: {{ $np.coreServicePort }}
    {{- end }}
    {{- if $np.egressCIDRs }}
    - to:
        {{- range $np.egressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}

{{- if .Values.secrets.keyVault.enabled }}
{{- $kv := .Values.secrets.keyVault }}
{{- if or (not $kv.keyVaultName) (not $kv.tenantId) }}
{{- fail "secrets.keyVault.keyVaultName and secrets.keyVault.tenantId are required when secrets.keyVault.enabled" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "hsmfs.fullname" . }}-keyvault
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsmfs.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ index .Values.serviceAccount.annotations "azure.workload.identity/client-id" | quote }}
    keyvaultName: {{ $kv.keyVaultName | quote }}
    tenantId: {{ $kv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $kv.privateKeySecretName }}
          objectType: secret
          objectAlias: app-private-key.pem
        {{- if $kv.signingKeySecretName }}
        - |
          objectName: {{ $kv.signingKeySecretName }}
          objectType: secret
          objectAlias: signing-key.pem
        {{- end }}
        {{- if $kv.mtlsCertSecretName }}
        - |
          objectName: {{ $kv.mtlsCertSecretName }}
          objectType: secret
          objectAlias: mtls-cert.pem
        {{- end }}
        {{- if $kv.mtlsKeySecretName }}
        - |
          objectName: {{ $kv.mtlsKeySecretName }}
          objectType: secret
          objectAlias: mtls-key.pem
        {{- end }}
{{- end }}

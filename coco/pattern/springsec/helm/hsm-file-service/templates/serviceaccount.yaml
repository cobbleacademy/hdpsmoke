{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hsmfs.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsmfs.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# No Role/RoleBinding anywhere in this chart: the ServiceAccount is only a Workload
# Identity federation anchor. The pod has zero Kubernetes API permissions.
automountServiceAccountToken: true
{{- end }}

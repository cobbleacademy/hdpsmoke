{{- if .Values.istio.peerAuthentication.enabled }}
# Every caller must present a mesh identity -- the basis of the option-A trust model.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "hsmfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsmfs.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hsmfs.selectorLabels" . | nindent 6 }}
  mtls:
    mode: STRICT
---
{{- end }}
{{- if .Values.istio.authorizationPolicy.enabled }}
# ALLOW-list: anything not matched below is denied by the sidecar before it reaches the JVM.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "hsmfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsmfs.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hsmfs.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- range .Values.istio.authorizationPolicy.bffPrincipals }}
              - {{ . | quote }}
              {{- end }}
      to:
        - operation:
            ports: [{{ .Values.service.port | quote }}]
            methods: ["GET"]
            # API v1 and v2: the same endpoint (java/docs/API_VERSIONS.md).
            paths:
              - {{ printf "%s/files/*" .Values.config.server.apiPrefix | quote }}
              - {{ printf "%s/files/*" .Values.config.server.apiV2Prefix | quote }}
    {{- if .Values.docs.enabled }}
    # Developer docs through the ingress gateway (docs.enabled; never in production).
    {{- $p := .Values.config.server.apiPrefix }}
    {{- $p2 := .Values.config.server.apiV2Prefix }}
    - from:
        - source:
            principals:
              {{- range .Values.docs.gatewayPrincipals }}
              - {{ . | quote }}
              {{- end }}
      to:
        - operation:
            ports: [{{ .Values.service.port | quote }}]
            methods: ["GET"]
            paths:
              - {{ printf "%s/docs" $p | quote }}
              - {{ printf "%s/openapi" $p | quote }}
              - {{ printf "%s/openapi/*" $p | quote }}
              - {{ printf "%s/swagger-ui/*" $p | quote }}
              # v2 entry point (opens the same Swagger UI on v2) and the v2 spec.
              - {{ printf "%s/docs" $p2 | quote }}
              - {{ printf "%s/openapi" $p2 | quote }}
              {{- if .Values.docs.tryItOut }}
              - {{ printf "%s/files/*" $p | quote }}
              - {{ printf "%s/files/*" $p2 | quote }}
              {{- end }}
    {{- end }}
    {{- if .Values.istio.authorizationPolicy.monitoringNamespaces }}
    - from:
        - source:
            namespaces:
              {{- range .Values.istio.authorizationPolicy.monitoringNamespaces }}
              - {{ . | quote }}
              {{- end }}
      to:
        - operation:
            ports: [{{ .Values.service.managementPort | quote }}]
            methods: ["GET"]
            paths: ["/actuator/prometheus", "/actuator/health/*"]
    {{- end }}
{{- end }}

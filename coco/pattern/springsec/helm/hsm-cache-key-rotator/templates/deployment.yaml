{{- if not (has .Values.bcFips.nativeMode (list "native" "java")) }}
{{- fail "bcFips.nativeMode must be native or java" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hsm-cache-key-rotator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsm-cache-key-rotator.labels" . | nindent 4 }}
spec:
  # Singleton — two replicas writing to the same AKV slot simultaneously
  # would race.  Keep this fixed at 1; do not wire up an HPA for this chart.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hsm-cache-key-rotator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hsm-cache-key-rotator.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hsm-cache-key-rotator.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      containers:
        - name: hsm-cache-key-rotator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          # No HTTP server → no ports to expose.
          env:
            - name: AZURE_KEYVAULT_SECRET_URL
              value: {{ .Values.config.azureKeyVaultSecretUrl | quote }}
            - name: CEK_ALPHA_SECRET_NAME
              value: {{ .Values.config.cekAlphaSecretName | quote }}
            - name: CEK_BETA_SECRET_NAME
              value: {{ .Values.config.cekBetaSecretName | quote }}
            - name: CURRENT_KEY_SECRET_NAME
              value: {{ .Values.config.currentKeySecretName | quote }}
            - name: ROTATION_INTERVAL_HOURS
              value: {{ .Values.config.rotationIntervalHours | quote }}
            - name: REDIS_POST_ROTATION_MODE
              value: {{ .Values.config.redisPostRotationMode | quote }}
            - name: DEK_CACHE_TTL_SECONDS
              value: {{ .Values.config.dekCacheTtlSeconds | quote }}
            {{- if .Values.config.redisUrl }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            {{- end }}
            {{- if eq .Values.bcFips.nativeMode "java" }}
            # Pure-Java BC-FIPS: nothing unpacked or executed from disk.
            - name: JDK_JAVA_OPTIONS
              value: "-Dorg.bouncycastle.native.cpu_variant=java"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $bcNative := eq .Values.bcFips.nativeMode "native" }}
          {{- if or .Values.tmpVolume.enabled $bcNative }}
          volumeMounts:
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if eq .Values.bcFips.nativeMode "native" }}
            # BC-FIPS unpacks and loads its native libraries here (the image sets
            # -Dorg.bouncycastle.native.loader.install_dir=/opt/bc-native), so /tmp
            # never needs to be executable.
            - name: bc-native
              mountPath: /opt/bc-native
            {{- end }}
          {{- end }}
      {{- if or .Values.tmpVolume.enabled $bcNative }}
      volumes:
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
        {{- end }}
        {{- if eq .Values.bcFips.nativeMode "native" }}
        # Disk-backed and without noexec: the JVM must mmap these libraries executable.
        - name: bc-native
          emptyDir:
            sizeLimit: {{ .Values.bcFips.nativeVolumeSizeLimit }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

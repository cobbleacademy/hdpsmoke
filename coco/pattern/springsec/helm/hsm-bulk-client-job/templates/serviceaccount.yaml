{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hsm.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsm.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Deliberately no Role/RoleBinding/ClusterRoleBinding created here -- this SA
# exists solely as a Workload Identity federation anchor for Azure AD (needed
# only for ADLS-targeting File runs), same as hsm-bulk-service's own SA. Zero
# Kubernetes API permissions.
automountServiceAccountToken: true
{{- end }}

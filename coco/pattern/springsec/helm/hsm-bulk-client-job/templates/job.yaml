{{- if not (has .Values.bcFips.nativeMode (list "native" "java")) }}
{{- fail "bcFips.nativeMode must be native or java" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hsm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hsm.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  {{- if ge (int .Values.ttlSecondsAfterFinished) 0 }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "hsm.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "hsm.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      containers:
        - name: hsm-bulk-client
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (eq .Values.bcFips.nativeMode "java") .Values.deid.enabled }}
          env:
            {{- if eq .Values.bcFips.nativeMode "java" }}
            # Pure-Java BC-FIPS: nothing unpacked or executed from disk.
            - name: JDK_JAVA_OPTIONS
              value: "-Dorg.bouncycastle.native.cpu_variant=java"
            {{- end }}
            {{- if .Values.deid.enabled }}
            - name: JOB_TYPE
              value: DEID
            - name: DEID_PROFILE
              value: "/deid-profiles/{{ required "deid.profile is required when deid.enabled (a file name in deid.profilesConfigMap)" .Values.deid.profile }}"
            - name: DEID_OUTPUT_ROOT
              value: {{ .Values.deid.output.mountPath | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: job-config
              mountPath: /config
              readOnly: true
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.deid.enabled }}
            - name: deid-profiles
              mountPath: /deid-profiles
              readOnly: true
            - name: deid-out
              mountPath: {{ .Values.deid.output.mountPath }}
              {{- with .Values.deid.output.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
            {{- if eq .Values.bcFips.nativeMode "native" }}
            # BC-FIPS unpacks and loads its native libraries here (the image sets
            # -Dorg.bouncycastle.native.loader.install_dir=/opt/bc-native), so /tmp
            # never needs to be executable.
            - name: bc-native
              mountPath: /opt/bc-native
            {{- end }}
      volumes:
        # The entire per-run job -- DB or File, encrypt or decrypt, table/columns
        # or source/target roots, plus credentials (private-key-pem, DB password,
        # bearer token) -- lives as one key in one Secret, mounted at the fixed
        # path Dockerfile.hsm-bulk-client's ENTRYPOINT already points at
        # (--spring.config.additional-location=file:/config/job.yml). This chart
        # does not create the Secret -- see NOTES.txt for the kubectl command to
        # create it before `helm install`.
        - name: job-config
          secret:
            secretName: {{ required "secretName is required -- create a Secret with key job.yml first (see NOTES.txt), then --set secretName=<name>" .Values.secretName }}
            items:
              - key: job.yml
                path: job.yml
        {{- if .Values.deid.enabled }}
        # Reviewed vendor profiles (DEIDENTIFICATION.md section 6), one file per vendor.
        - name: deid-profiles
          configMap:
            name: {{ required "deid.profilesConfigMap is required when deid.enabled" .Values.deid.profilesConfigMap }}
        # The client's MFT pick-up folder.
        - name: deid-out
          persistentVolumeClaim:
            claimName: {{ required "deid.output.persistentVolumeClaim is required when deid.enabled" .Values.deid.output.persistentVolumeClaim }}
        {{- end }}
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
        {{- end }}
        {{- if eq .Values.bcFips.nativeMode "native" }}
        # Disk-backed and without noexec: the JVM must mmap these libraries executable.
        - name: bc-native
          emptyDir:
            sizeLimit: {{ .Values.bcFips.nativeVolumeSizeLimit }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
